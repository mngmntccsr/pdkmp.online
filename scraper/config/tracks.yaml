# =============================================================================
# CONFIGURAZIONE AUTODROMI
# =============================================================================
# Per aggiungere un nuovo autodromo in futuro basta aggiungere un nuovo blocco
# qui sotto (vedi README.md -> "Aggiungere un nuovo autodromo").
#
# parser:
#   - "static"  -> pagina HTML semplice, scraping via requests + BeautifulSoup
#   - "dynamic" -> pagina che carica gli eventi via JavaScript, richiede
#                  Playwright (browser headless) per essere renderizzata
#
# selectors: selettori CSS usati per estrarre gli eventi dalla pagina.
#   Questi selettori sono un PUNTO DI PARTENZA basato sull'analisi della
#   struttura attuale dei siti. I siti cambiano nel tempo: se lo scraper
#   smette di trovare eventi, usa `tools/inspect_page.py` per ispezionare
#   l'HTML renderizzato e aggiornare i selettori qui sotto.
# =============================================================================

tracks:

  - slug: imola
    name: "Autodromo di Imola"
    citta: "Imola"
    url: "https://www.autodromoimola.it/en/events/"
    parser: static
    selectors:
      # ogni evento è un link dentro il blocco "All events" / "Past events"
      event_container: "a[href*='/en/events/']"
      title: "self"          # il testo del link stesso contiene titolo + data
      link: "self"
    date_hint_language: en

  - slug: monza
    name: "Autodromo Nazionale Monza"
    citta: "Monza"
    url: "https://www.monzanet.it/gare-eventi/"
    parser: dynamic
    wait_selector: ".eventon_list_event, .evo_event"
    selectors:
      event_container: ".eventon_list_event, .evcal_evdata_row, .evo_event"
      title: ".evcal_event_title, .evoet_evtitle"
      date: ".evcal_desc4, .evcal_date, .evcal_event_time"
      link: "a"
    date_hint_language: it

  - slug: misano
    name: "Misano World Circuit"
    citta: "Misano Adriatico"
    url: "https://www.misanocircuit.com/events"
    parser: dynamic
    wait_selector: "[class*='event'], [class*='card']"
    selectors:
      event_container: "[class*='event-card'], [class*='EventCard'], article, a[href*='/events/']"
      title: "h2, h3, [class*='title']"
      date: "[class*='date'], time"
      link: "a"
    date_hint_language: it

  - slug: vallelunga
    name: "Autodromo di Vallelunga"
    citta: "Campagnano di Roma"
    url: "https://motorsport.vallelunga.it/gare/"
    parser: static
    selectors: {}   # non usati: vallelunga.py fa parsing testuale dedicato
    date_hint_language: it

  - slug: mugello
    name: "Mugello Circuit"
    citta: "Scarperia e San Piero"
    url: "https://mugellocircuit.com/it/gare"
    parser: static
    selectors: {}   # non usati: mugello.py fa parsing testuale dedicato (data affidabile dall'URL)
    date_hint_language: it

  - slug: wecanrace
    name: "We Can Race"   # non usato direttamente: ogni evento ha il suo circuito (vedi wecanrace.py)
    citta: ""             # idem, sovrascritta per ogni evento
    url: "https://wecanrace.it/calendario/"
    parser: dynamic
    wait_selector: "h3"
    selectors: {}   # non usati: wecanrace.py fa parsing testuale dedicato
    date_hint_language: it

  - slug: autoraduni
    name: "Autoraduni.it"
    citta: ""   # sovrascritta per ogni evento con la città reale
    url: "https://www.autoraduni.it/"
    parser: static
    skip_motorsport_filter: true   # il sito è già 100% automotive, niente filtro keyword
    selectors: {}   # non usati: autoraduni.py fa parsing dedicato via data-attribute
    date_hint_language: it

  - slug: rallylink
    name: "Rallylink.it"
    citta: ""
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSc1gqQJ6DcVQelwIQnHEbYNh1gs_BOgQ10pgjflojrBst-NE43C8Kngzhypy3VYZrI4DV8f75VPMV_/pub?gid=1403552672&single=true&output=csv"
    parser: static
    skip_motorsport_filter: true
    season_year: 2026
    selectors: {}
    date_hint_language: it  

  - slug: raduni_auto
    name: "Raduni-Auto.it"
    citta: ""
    url: "https://raduni-auto.it/raduni.php"
    parser: static
    skip_motorsport_filter: true
    selectors: {}
    date_hint_language: it  

  - slug: trackdays
    name: "Track-Days.it"
    citta: ""
    url: "https://track-days.it/calendario/"
    parser: static
    skip_motorsport_filter: true
    selectors: {}
    date_hint_language: it
  

# =============================================================================
# PAROLE CHIAVE PER LA CLASSIFICAZIONE DEGLI EVENTI
# =============================================================================
# Un evento viene TENUTO se contiene almeno una keyword di "include" e
# NESSUNA keyword di "exclude" (l'exclude ha sempre la precedenza).
# Tutto case-insensitive, matching su titolo (+ categoria se disponibile).
#
# Modifica liberamente queste liste in base a cosa vuoi vedere/nascondere.
# =============================================================================

keywords:
  include:
    # gare / campionati
    - "gran premio"
    - "gp "
    - "moto gp"
    - "motogp"
    - "superbike"
    - "worldsbk"
    - "sbk"
    - "civ"
    - "campionato italiano velocit"
    - "gt world challenge"
    - "gt open"
    - "wec"
    - "endurance"
    - "le mans series"
    - "formula "
    - "f1"
    - "f4"
    - "f3"
    - "eurocup"
    - "porsche carrera cup"
    - "porsche club"
    - "porsche sports cup"
    - "fim"
    - "motorsport"
    - "tcr"
    - "aci racing weekend"
    - "coppa italia"
    - "trofeo"
    - "challenge"
    - "revival"
    - "historic"
    - "classic"
    - "rally"           # rally regolarità storiche su pista, valuta se tenerlo
    - "karting"
    - "kart"
    # trackday / uso pista
    - "track day"
    - "trackday"
    - "pista aperta"
    - "prova libera"
    - "test collettivo"
    - "test ufficiali"
    - "driving experience"
    - "circuit experience"
    - "we can race"
    - "raceday"
    - "race day"
    - "racing weekend"
    - "drift"
    - "nascar"
    - "time attack"
    - "storic"          # copre storico/storica/storiche/autostoriche
    - "endurance"
    - "24 ore"
    - "12 ore"
    - "2h di roma"

  exclude:
    # eventi non motoristici ospitati nell'impianto
    - "cinema"
    - "concerto"
    - "live26"
    - " live "
    - "festival"
    - "mostra scambio"
    - "mostra-scambio"
    - "comics"
    - "halloween"
    - "degusta"
    - "food"
    - "fiera"
    - "mercatino"
    - "villaggio"
    - "yoga"
    - "podistica"
    - "corsa podistica"
    - "marcia"
    - "maratona"
    - "run for life"
    - "duathlon"
    - "triathlon"
    - "ciclismo"
    - "bike day"
    - "handcycling"
    - "camminata"
    - "cammina"
    - "walk"
    # raduni moto non agonistici (club, harley davidson, ecc.)
    - "raduno moto"
    - "chapter"
    - "harley"
    - "h.o.g."
    - "hog rally"

  # =============================================================================
  # INGRESSO GRATUITO (best-effort, VERIFICA SEMPRE A MANO)
  # =============================================================================
  # Se il titolo contiene una di queste parole, l'evento viene marcato come
  # "eventoGratuito": true. In Italia i weekend amatoriali/trackday sono
  # tipicamente a ingresso spettatori libero, mentre i campionati ufficiali
  # (CIV, GT, WEC...) di solito richiedono un biglietto. Aggiungi/rimuovi
  # voci in base a quello che sai sui singoli autodromi/eventi.
  free_entry:
    - "racing weekend"
    - "trackday"
    - "track day"
    - "prova libera"
    - "pista aperta"
    - "driving experience"
    - "circuit experience"
    - "test collettivo"
    - "raceday"
    - "race day"

  # =============================================================================
  # ORGANIZZATORE (usato anche per l'immagine automatica sul sito)
  # =============================================================================
  # index.html assegna un'immagine fissa in base al campo "organizzatore"
  # (vedi "organizerImages" in index.html). Popolando qui questo campo per
  # gli eventi ricorrenti, l'immagine resta la stessa ovunque l'evento si
  # svolga, senza doverla reimpostare ogni volta. "match" deve essere una
  # sottostringa del titolo (case-insensitive); "organizzatore" deve
  # combaciare ESATTAMENTE con una chiave di organizerImages in index.html.
  organizer_rules:
    - match: "aci racing weekend"
      organizzatore: "ACI Sport"
    - match: "fx racing weekend"
      organizzatore: "FX Racing Weekend"
    - match: "we can race"
      organizzatore: "We Can Race"

# =============================================================================
# ALIAS CIRCUITI
# =============================================================================
# Le fonti multi-circuito (WeCanRace, e in futuro altre) spesso usano il
# nome UFFICIALE completo di un autodromo, diverso dal nome che vuoi tu sul
# sito. Ogni volta che il nome a sinistra viene trovato, viene sostituito
# con quello a destra prima di finire su events.json.
# Aggiungi qui una riga ogni volta che scopri un nuovo disallineamento,
# senza dover toccare il codice.
circuit_aliases:     # Valido anche per le città (prima nome sbagliato poi quello corretto)
  "Autodromo Internazionale del Mugello": "Mugello Circuit"
  "Autodromo Enzo e Dino Ferrari": "Autodromo di Imola"
  "Autodromo Piero Taruffi": "Autodromo di Vallelunga"
  "San Paolo Belsito": "San Paolo Bel Sito"
  "Bassano": "Bassano del Grappa"
  "Scarperia S. Piero": "Scarperia e San Piero"
  "Varano de Melegari": "Varano de' Melegari"
  "S.G. di Comacchio": "San Giuseppe di Comacchio"

# Nomi propri da ricapitalizzare nei titoli TUTTO MAIUSCOLO (vedi
# text_utils.py). Aggiungi qui una città/nome ogni volta che ne trovi
# uno scritto in minuscolo per errore in un titolo normalizzato.
rally_proper_nouns:
    - "Milano"
    - "Roma"
    - "Torino"
    - "Budapest"
    - "Sanremo"

#Titoli di eventi da escludere      
excluded_titles:
  - "Monza Rally Show"
