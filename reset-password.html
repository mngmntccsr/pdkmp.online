<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nuova password | PaddockMap</title>
<script src="consent.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="a11y.css">
<script src="icons.js"></script>
<script src="vendor/supabase.js"></script>
<script src="auth.js" defer></script>
<script src="a11y.js" defer></script>
</head>
<body style="height:auto;overflow:auto;display:block">
<header class="header"><div class="header-content">
  <div class="logo">Paddock<span>Map</span></div>
  <nav class="nav-menu"><a href="index.html">Home</a><a href="mappa.html">Mappa</a><a href="contatti.html">Segnala Evento</a></nav>
</div></header>
<main style="max-width:420px;margin:3rem auto;padding:0 1.25rem">
  <div class="form-card">
    <h1>Scegli una nuova password</h1>
    <p id="msg">Verifica del link in corso…</p>
    <form id="f" style="display:none">
      <label for="p1">Nuova password</label>
      <input type="password" id="p1" minlength="8" required autocomplete="new-password" placeholder="Almeno 8 caratteri">
      <label for="p2">Ripeti la password</label>
      <input type="password" id="p2" minlength="8" required autocomplete="new-password">
      <button type="submit" class="btn btn-primary">Salva password</button>
    </form>
  </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var msg = document.getElementById('msg'), f = document.getElementById('f'), shown = false;
  function show() {
    if (shown) return; shown = true;
    msg.textContent = 'Inserisci la nuova password.'; f.style.display = 'block';
  }
  function init() {
    var sb = window.pmSupabase;
    if (!sb) return setTimeout(init, 100);
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') show(); });
    setTimeout(async function () {
      var r = await sb.auth.getSession();
      if (r.data.session) show();
      else if (!shown) msg.textContent = 'Link non valido o scaduto. Torna al login e richiedi un nuovo link.';
    }, 700);
    f.addEventListener('submit', async function (e) {
      e.preventDefault();
      var a = document.getElementById('p1').value, b = document.getElementById('p2').value;
      if (a !== b) { msg.textContent = 'Le due password non coincidono.'; return; }
      var r = await sb.auth.updateUser({ password: a });
      if (r.error) { msg.textContent = 'Impossibile salvare: ' + r.error.message; return; }
      f.style.display = 'none';
      msg.innerHTML = 'Password aggiornata. <a href="index.html">Vai alla home</a>';
    });
  }
  init();
});
</script>
</body>
</html>
