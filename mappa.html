<meta charset="UTF-8">

<body>

<header class="header" id="mainHeader">
<div class="header-content">
<div class="logo">Paddock<span>Map</span></div>
<nav class="nav-menu">
<a href="index.html" onclick="gtag('event', 'nav_click', { nav_item: 'home' })">Home</a>

<a href="contatti.html" onclick="gtag('event', 'nav_click', { nav_item: 'promuovi_evento' })">Promuovi Evento</a>
</nav>
  <div class="header-stats">
  <div class="stat">
    <span class="stat-number" id="totalEvents">0</span>
    <span class="stat-label">Eventi</span>
  </div>
  <div class="stat">
    <span class="stat-number" id="totalCircuits">0</span>
    <span class="stat-label">Locations</span>
  </div>
</div>
</div>
</header>

<div class="page-wrap">

<div class="map-half">
<div id="interactiveMapFull"></div>
</div>

<div class="filters-half">
<div class="filters-inner">
<h3>Filtra eventi</h3>

<div class="filter-group">
<label>Data</label>
<div class="date-picker" id="datePicker">
    <button type="button" class="date-picker-trigger" onclick="toggleDatePicker()">
        <span id="datePickerLabel" class="placeholder">Qualsiasi data</span>
        <span class="date-picker-trigger-icons">
            <span class="date-picker-clear-x" onclick="clearDateRangeQuiet(event)" title="Cancella">✕</span>
        </span>
    </button>
    <div class="date-picker-panel" id="datePickerPanel">
        <div class="date-picker-header">
            <button type="button" class="date-picker-nav" onclick="changeCalendarMonth(-1)">‹</button>
            <span id="datePickerMonthLabel"></span>
            <button type="button" class="date-picker-nav" onclick="changeCalendarMonth(1)">›</button>
        </div>
        <div class="date-picker-weekdays">
            <span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="date-picker-days" id="datePickerDays"></div>
    </div>
</div>
</div>

<div class="filter-group">
<label>Tipo di evento</label>
<div class="multi-select" data-filter="discipline" data-placeholder="Tutti i tipi">
<div class="multi-select-display" onclick="toggleMultiSelect(this)">
<span class="placeholder">Tutti i tipi</span>
</div>
<div class="multi-select-options">
                                    <div class="multi-select-option" data-value="Gt">GT</div>
                                    <div class="multi-select-option" data-value="Formula">Formula</div>
                                    <div class="multi-select-option" data-value="Misto">Misto</div>
                                    <div class="multi-select-option" data-value="Storico">Storico</div>
                                    <div class="multi-select-option" data-value="Rally">Rally</div>
                                    <div class="multi-select-option" data-value="Le Mans Prototype">Le Mans Prototype</div>
                                    <div class="multi-select-option" data-value="Cronoscalata">Cronoscalata</div>
                                    <div class="multi-select-option" data-value="Raduno">Raduno</div>
                                    <div class="multi-select-option" data-value="Trackday">Trackday</div>
</div>
</div>
</div>

<div class="filter-group">
<label for="filterSearch">Cerca</label>
<input type="text" id="filterSearch" placeholder="Nome evento, circuito...">
</div>

<div class="filter-group">
<label for="mapRadiusRange">Distanza: <span class="radius-value" id="mapRadiusValue">off</span></label>
<input type="range" id="mapRadiusRange" min="5" max="300" step="5" value="50" disabled>
</div>

<button class="btn-locate" id="mapLocateBtn"></button>
<button class="reset-filters" id="resetFiltersBtn">Cancella filtri</button>

<p class="map-hint">Clicca sulla mappa per cercare entro una certa distanza da un punto.</p>
</div>
</div>

</div>

<script>
document.getElementById('mapLocateBtn').innerHTML = PMIcons.locate + ' Usa la mia posizione';

(function () {
  let allEvents = [];
  let map, markersLayer, searchCircle, centerMarker;
  let searchCenter = null;
  let searchRadiusKm = 50;

  // ===== Filtro data: calendario a comparsa in stile "liquid glass" =====
  const ITALIAN_MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  let calendarViewDate = new Date();
  calendarViewDate.setDate(1);
  let rangeStart = null;
  let rangeEnd = null;

  function toISODate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseISODate(s) {
    if (!s) return null;
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatShortIt(d) {
    return `${d.getDate()} ${ITALIAN_MONTHS[d.getMonth()].substring(0, 3)}`;
  }

  function updateDatePickerLabel() {
    const label = document.getElementById('datePickerLabel');
    const picker = document.getElementById('datePicker');
    if (!label) return;
    if (rangeStart && rangeEnd) {
        label.textContent = `${formatShortIt(rangeStart)} – ${formatShortIt(rangeEnd)}`;
        label.classList.remove('placeholder');
    } else if (rangeStart) {
        label.textContent = `${formatShortIt(rangeStart)} – ?`;
        label.classList.remove('placeholder');
    } else {
        label.textContent = 'Qualsiasi data';
        label.classList.add('placeholder');
    }
    if (picker) picker.classList.toggle('has-value', !!rangeStart);
  }

  function renderCalendar() {
    const monthLabel = document.getElementById('datePickerMonthLabel');
    const daysContainer = document.getElementById('datePickerDays');
    if (!monthLabel || !daysContainer) return;

    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();
    monthLabel.textContent = `${ITALIAN_MONTHS[month]} ${year}`;

    const firstOfMonth = new Date(year, month, 1);
    let startOffset = firstOfMonth.getDay() - 1; // lunedì = 0
    if (startOffset < 0) startOffset = 6;

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const cells = [];
    for (let i = 0; i < startOffset; i++) {
        cells.push({ date: new Date(year, month - 1, daysInPrevMonth - startOffset + i + 1), otherMonth: true });
    }
    for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ date: new Date(year, month, d), otherMonth: false });
    }
    while (cells.length % 7 !== 0) {
        const last = cells[cells.length - 1].date;
        const next = new Date(last);
        next.setDate(next.getDate() + 1);
        cells.push({ date: next, otherMonth: true });
    }

    const rs = rangeStart ? new Date(rangeStart).setHours(0, 0, 0, 0) : null;
    const re = rangeEnd ? new Date(rangeEnd).setHours(0, 0, 0, 0) : null;

    daysContainer.innerHTML = cells.map(cell => {
        const classes = ['date-picker-day'];
        if (cell.otherMonth) classes.push('other-month');
        const cellTime = new Date(cell.date).setHours(0, 0, 0, 0);
        if (cellTime === today.getTime()) classes.push('today');
        if (rs !== null && cellTime === rs) classes.push('range-start');
        if (re !== null && cellTime === re) classes.push('range-end');
        if (rs !== null && re !== null && cellTime > rs && cellTime < re) classes.push('in-range');

        return `<button type="button" class="${classes.join(' ')}" onclick="selectCalendarDay('${toISODate(cell.date)}')">${cell.date.getDate()}</button>`;
    }).join('');
  }

  window.selectCalendarDay = function (iso) {
    const clicked = parseISODate(iso);
    if (!rangeStart || (rangeStart && rangeEnd)) {
        rangeStart = clicked;
        rangeEnd = null;
    } else if (clicked < rangeStart) {
        rangeStart = clicked;
        rangeEnd = null;
    } else {
        rangeEnd = clicked;
    }
    renderCalendar();
    updateDatePickerLabel();

    // applica subito, anche con una sola data impostata
    applyFilters();

    // chiude il calendario solo quando il range è completo
    if (rangeStart && rangeEnd) {
        const picker = document.getElementById('datePicker');
        if (picker) picker.classList.remove('open');
    }
  };

  window.changeCalendarMonth = function (delta) {
    calendarViewDate.setMonth(calendarViewDate.getMonth() + delta);
    renderCalendar();
  };

  window.toggleDatePicker = function () {
    const picker = document.getElementById('datePicker');
    const isOpen = picker.classList.contains('open');
    document.querySelectorAll('.multi-select-options.active').forEach(el => el.classList.remove('active'));
    if (isOpen) {
        picker.classList.remove('open');
    } else {
        picker.classList.add('open');
        renderCalendar();
    }
  };

  window.clearDateRangeQuiet = function (event) {
    if (event) event.stopPropagation();
    rangeStart = null;
    rangeEnd = null;
    renderCalendar();
    updateDatePickerLabel();
    const picker = document.getElementById('datePicker');
    if (picker) picker.classList.remove('open');
    applyFilters();
  };

  function initMap() {
    gtag('event', 'map_open');
    map = createBaseMap('interactiveMapFull');
    map.setView([41.5, 12.5], 6);
    markersLayer = L.layerGroup().addTo(map);
    map.on('click', (e) => {
        gtag('event', 'map_search', {
            radius_km: searchRadiusKm
        });
        setSearchCenter(e.latlng.lat, e.latlng.lng);
    });
    window.addEventListener('resize', () => map.invalidateSize());
    setTimeout(() => map.invalidateSize(), 200);
  }

  function getSelectedValues(filterName) {
    return Array.from(document.querySelectorAll(`[data-filter="${filterName}"] .multi-select-option.selected`))
      .map(o => o.dataset.value);
  }

  function applyFilters() {
    const disciplines = getSelectedValues('discipline');
    const searchText = document.getElementById('filterSearch').value.trim().toLowerCase();
    const dateFromISO = rangeStart ? toISODate(rangeStart) : '';
    const dateToISO = rangeEnd ? toISODate(rangeEnd) : '';

    const filtered = allEvents.filter(ev => {
      if (disciplines.length && !(ev.disciplina || []).some(d => disciplines.includes(d))) return false;
      if (dateFromISO && (ev.dataInizio || '') < dateFromISO) return false;
      if (dateToISO && (ev.dataInizio || '') > dateToISO) return false;
      if (searchText) {
        const haystack = `${ev.titolo} ${ev.circuito || ''} ${ev.citta || ''}`.toLowerCase();
        if (!haystack.includes(searchText)) return false;
      }
      if (searchCenter) {
        const coords = cityCoordinates[ev.citta];
        if (!coords) return false;
        if (haversineKm(searchCenter.lat, searchCenter.lng, coords[0], coords[1]) > searchRadiusKm) return false;
      }
      return true;
    });

    renderMarkers(filtered);
    updateResetButtonState(disciplines, searchText);
  }

  function renderMarkers(events) {
    markersLayer.clearLayers();
    const groups = groupEventsByLocation(events, ev => ev.citta);

    groups.forEach(group => {
      const marker = createGroupMarker(group, (ev) => `
        <strong>${ev.titolo}</strong><br>
        ${formatEventDate(ev.dataInizio, ev.dataFine)} · ${ev.circuito || ev.citta}<br>
        ${ev.idAuto ? `<a href="evento.html?id=${encodeURIComponent(ev.idAuto)}">Maggiori info</a>` : ''}
      `);
      marker.addTo(markersLayer);
    });

    updateHeaderStats(events);
  }

  function updateHeaderStats(events) {
    const totalEventsEl = document.getElementById('totalEvents');
    const totalCircuitsEl = document.getElementById('totalCircuits');
    if (totalEventsEl) totalEventsEl.textContent = events.length;
    if (totalCircuitsEl) {
      const circuits = new Set(events.map(e => e.circuito).filter(c => c && c.trim() !== ''));
      totalCircuitsEl.textContent = circuits.size;
    }
  }

  function updateResetButtonState(disciplines, searchText) {
    const btn = document.getElementById('resetFiltersBtn');
    const active = disciplines.length > 0 || !!searchText || !!searchCenter || !!rangeStart;
    btn.classList.toggle('active', active);
  }

  function setSearchCenter(lat, lng) {
    searchCenter = { lat, lng };
    document.getElementById('mapRadiusRange').disabled = false;
    document.getElementById('mapRadiusValue').textContent = searchRadiusKm + ' km';
    drawCircle();
    applyFilters();
  }

  function drawCircle() {
    if (searchCircle) map.removeLayer(searchCircle);
    if (centerMarker) map.removeLayer(centerMarker);
    if (!searchCenter) return;

    centerMarker = L.circleMarker([searchCenter.lat, searchCenter.lng], {
      radius: 5, weight: 2, color: '#12151B', fillColor: '#12151B', fillOpacity: 1
    }).addTo(map);

    searchCircle = L.circle([searchCenter.lat, searchCenter.lng], {
      radius: searchRadiusKm * 1000,
      color: '#FF4B24', weight: 1.5, fillColor: '#FF4B24', fillOpacity: 0.08
    }).addTo(map);

    map.fitBounds(searchCircle.getBounds(), { maxZoom: 9 });
  }

  window.toggleMultiSelect = function (displayEl) {
    const options = displayEl.nextElementSibling;
    document.querySelectorAll('.multi-select-options.active').forEach(el => {
      if (el !== options) el.classList.remove('active');
    });
    options.classList.toggle('active');
    const picker = document.getElementById('datePicker');
    if (picker) picker.classList.remove('open');
  };

  function updateMultiSelectDisplay(multiSelectEl) {
    const display = multiSelectEl.querySelector('.multi-select-display');
    const placeholder = multiSelectEl.dataset.placeholder;
    const selected = Array.from(multiSelectEl.querySelectorAll('.multi-select-option.selected'));
    display.innerHTML = selected.length === 0
      ? `<span class="placeholder">${placeholder}</span>`
      : selected.map(s => `<span class="selected-tag">${s.textContent}</span>`).join('');
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.multi-select')) {
      document.querySelectorAll('.multi-select-options.active').forEach(el => el.classList.remove('active'));
    }
    if (!e.target.closest('.date-picker')) {
      const picker = document.getElementById('datePicker');
      if (picker) picker.classList.remove('open');
    }
  });

  document.querySelectorAll('.multi-select-option').forEach(opt => {
    opt.addEventListener('click', () => {
      opt.classList.toggle('selected');
      updateMultiSelectDisplay(opt.closest('.multi-select'));
      applyFilters();
    });
  });

  document.getElementById('filterSearch').addEventListener('input', applyFilters);

  document.getElementById('mapRadiusRange').addEventListener('input', (e) => {
    searchRadiusKm = parseInt(e.target.value, 10);
    document.getElementById('mapRadiusValue').textContent = searchRadiusKm + ' km';
    if (searchCircle) searchCircle.setRadius(searchRadiusKm * 1000);
    applyFilters();
  });

  document.getElementById('mapLocateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
          alert('Geolocalizzazione non supportata dal tuo browser.');
          return;
      }
      navigator.geolocation.getCurrentPosition(
          (pos) => {
              gtag('event', 'location_used');
              setSearchCenter(
                  pos.coords.latitude,
                  pos.coords.longitude
              );
          },
          () => alert('Impossibile ottenere la tua posizione.')
      );
  });

  document.getElementById('resetFiltersBtn').addEventListener('click', () => {
    document.querySelectorAll('.multi-select-option.selected').forEach(o => o.classList.remove('selected'));
    document.querySelectorAll('.multi-select').forEach(updateMultiSelectDisplay);
    document.getElementById('filterSearch').value = '';
    rangeStart = null;
    rangeEnd = null;
    renderCalendar();
    updateDatePickerLabel();
    const picker = document.getElementById('datePicker');
    if (picker) picker.classList.remove('open');
    searchCenter = null;
    document.getElementById('mapRadiusRange').disabled = true;
    document.getElementById('mapRadiusValue').textContent = 'off';
    if (searchCircle) map.removeLayer(searchCircle);
    if (centerMarker) map.removeLayer(centerMarker);
    map.setView([42.8, 12.5], 6);
    applyFilters();
  });

loadCityCoordinates().then(() => {
    initMap();

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
const today = todayISO();

    fetch('https://paddockmap-api.managementcesar37.workers.dev/?v=' + Date.now())
    .then(res => {
        if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
        return res.json();
    })
    .then(data => {
        allEvents = data.filter(event => (event.dataFine || event.dataInizio) >= today);
        applyFilters();
    })
    .catch(error => {
        console.error("Errore caricamento eventi:", error);
    });
});
})();
</script>

</body>
