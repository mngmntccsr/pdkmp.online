name: Pulizia eventi automatici di una pista

on:
  workflow_dispatch:
    inputs:
      circuito_contains:
        description: "Sottostringa del campo 'circuito' da ripulire (es: Misano)"
        required: true
        type: string
      dry_run:
        description: "Solo anteprima (non modifica nulla)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Esegui pulizia
        working-directory: scraper
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tools/purge_track_auto_events.py "${{ inputs.circuito_contains }}" --dry-run
          else
            python tools/purge_track_auto_events.py "${{ inputs.circuito_contains }}"
          fi

      - name: Commit modifiche (solo se non dry-run)
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "paddockmap-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "chore: pulizia eventi automatici (${{ inputs.circuito_contains }}) [skip ci]"
          git push
