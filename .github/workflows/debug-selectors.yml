name: Debug selettori Monza/Misano

on:
  workflow_dispatch: {}   # avviabile solo a mano da Actions -> Run workflow

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Salva HTML renderizzato di Monza, Misano e siti in esplorazione
        working-directory: scraper
        run: |
          python tools/inspect_page.py monza
          python tools/inspect_page.py misano
          python tools/inspect_page.py https://wecanrace.it/calendario/

      - name: Carica HTML come allegato scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-monza-misano
          path: scraper/debug_html/
          retention-days: 7
