    function relDateBlockHtml(item) {
      const range = relRange(item);
      if (!range) return '';
      const thisYear = new Date().getFullYear();
      const part = date => {
        const mon = date.toLocaleDateString('it-IT', { month: 'short', timeZone: 'UTC' }).replace('.', '');
        const yearTag = date.getUTCFullYear() !== thisYear ? ' ' + date.getUTCFullYear() : '';
        return `<span class="rel-date-part"><span class="rel-date-day">${date.getUTCDate()}</span><span class="rel-date-mon">${escapeHtml(mon + yearTag)}</span></span>`;
      };
      const multi = range.end.getTime() !== range.start.getTime();
      const label = relFormatDay(range.start, true) + (multi ? ' – ' + relFormatDay(range.end, true) : '');
      return `<span class="rel-date" role="text" aria-label="${escapeHtml(label)}">${part(range.start)}${multi ? '<span class="rel-date-sep" aria-hidden="true"></span>' + part(range.end) : ''}</span>`;
    }
    function relDisciplineChipsHtml(item) {
      const list = normalizeDisciplines(item);
      if (!list.length) return '';
      const shown = list.slice(0, 2);
      const extra = list.length - shown.length;
      const chips = shown.map(name => {
        const icon = REL_DISCIPLINE_ICONS[name];
        return `<span class="rel-disc">${icon ? `<img class="rel-disc-icon" src="${escapeHtml(icon)}" alt="">` : ''}${escapeHtml(name)}</span>`;
      }).join('');
      const more = extra > 0
        ? `<span class="rel-disc" title="${escapeHtml(list.slice(2).join(', '))}">+${extra}</span>`
        : '';
      return chips + more;
    }
    function relCardHtml(item, badge) {
      const sameName = item.citta && item.circuito &&
        normalizeEventLocation(item.citta) === normalizeEventLocation(item.circuito);
      const place = item.circuito && item.citta && !sameName
        ? `<strong>${escapeHtml(item.circuito)}</strong> – ${escapeHtml(item.citta)}`
        : `<strong>${escapeHtml(item.circuito || item.citta || '')}</strong>`;
      return `
        <a class="rel-card" href="evento.html?id=${encodeURIComponent(item.idAuto)}">
          <div class="rel-card-top">
            ${relDateBlockHtml(item)}
            ${badge ? `<span class="rel-badge">${escapeHtml(badge)}</span>` : ''}
          </div>
          <div class="rel-card-body">
            <h3 class="rel-card-title">${escapeHtml(item.titolo || 'Evento')}</h3>
            <div class="rel-discs">${relDisciplineChipsHtml(item)}</div>
            ${item.circuito || item.citta ? `<div class="rel-row">${PMIcons.pin}<span>${place}</span></div>` : ''}
            ${item.organizzatore ? `<div class="rel-row">${PMIcons.building}<span>${escapeHtml(item.organizzatore)}</span></div>` : ''}
          </div>
        </a>
      `;
    }
    function relSectionHtml(key, title, subtitle, items, badgeFn) {
      return `
        <section class="rel-section" data-rel="${key}" aria-labelledby="relTitle-${key}">
          <div class="rel-head">
            <div class="rel-head-text">
              <h2 class="rel-title" id="relTitle-${key}">${escapeHtml(title)}</h2>
              <p class="rel-subtitle">${subtitle}</p>
            </div>
            <div class="rel-nav" hidden>
              <button type="button" class="rel-arrow rel-prev" aria-label="Scorri indietro: ${escapeHtml(title)}">${REL_CHEVRON_LEFT}</button>
              <button type="button" class="rel-arrow rel-next" aria-label="Scorri avanti: ${escapeHtml(title)}">${REL_CHEVRON_RIGHT}</button>
            </div>
          </div>
          <div class="rel-track" tabindex="0" role="group" aria-label="${escapeHtml(title)}">
            ${items.map(item => relCardHtml(item, badgeFn ? badgeFn(item) : '')).join('')}
          </div>
        </section>
      `;
    }
    function relInitCarousel(section) {
      const track = section.querySelector('.rel-track');
      const nav = section.querySelector('.rel-nav');
      const prev = section.querySelector('.rel-prev');
      const next = section.querySelector('.rel-next');
      if (!track || !nav || !prev || !next) return;
      const reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const step = () => {
        const card = track.querySelector('.rel-card');
        if (!card) return track.clientWidth;
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
        return card.getBoundingClientRect().width + gap;
      };
      const go = direction => {
        track.scrollBy({ left: direction * step(), behavior: reduceMotion ? 'auto' : 'smooth' });
      };
      const update = () => {
        const max = track.scrollWidth - track.clientWidth;
        nav.hidden = max <= 2;
        prev.disabled = track.scrollLeft <= 2;
        next.disabled = track.scrollLeft >= max - 2;
      };
      prev.addEventListener('click', () => go(-1));
      next.addEventListener('click', () => go(1));
      track.addEventListener('scroll', update, { passive: true });
      track.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      });
      window.addEventListener('resize', update);
      update();
    }
    function relBuildCoordLookup() {
      const lookup = new Map();
      if (typeof cityCoordinates === 'undefined' || !cityCoordinates) return lookup;
      Object.keys(cityCoordinates).forEach(name => {
        const value = cityCoordinates[name];
        if (!Array.isArray(value) || value.length < 2) return;
        const lat = Number(value[0]);
        const lng = Number(value[1]);
        if (Number.isFinite(lat) && Number.isFinite(lng)) {
          lookup.set(normalizeEventLocation(name), { lat, lng });
        }
      });
      return lookup;
    }
    async function renderRelatedSections(event, allEvents) {
      const host = document.getElementById('relatedSections');
      if (!host) return;
      host.innerHTML = '';
      const currentRange = relRange(event);
      const today = relTodayUTC().getTime();
      const pool = (Array.isArray(allEvents) ? allEvents : []).filter(item =>
        item &&
        item.idAuto != null &&
        item.titolo &&
        !item.isPromo &&
        String(item.idAuto) !== String(event.idAuto) &&
        relRange(item)
      );
      const upcoming = pool.filter(item => relRange(item).end.getTime() >= today);
      const byStart = (a, b) => relRange(a).start.getTime() - relRange(b).start.getTime();
      const sections = [];
      /* ---------- 1) STESSO ORGANIZZATORE ---------- */
      const organizerKey = normalizeEventLocation(event.organizzatore);
      if (organizerKey) {
        const items = upcoming
          .filter(item => normalizeEventLocation(item.organizzatore) === organizerKey)
          .sort(byStart)
          .slice(0, REL_MAX_ITEMS);
        if (items.length) {
          sections.push(relSectionHtml(
            'organizzatore',
            'Dello stesso organizzatore',
            `Prossimi eventi organizzati da <strong>${escapeHtml(event.organizzatore)}</strong>`,
            items
          ));
        }
      }
      /* ---------- 2) NELLE VICINANZE ---------- */
      if (event.citta) {
        try {
          if (typeof cityCoordinates === 'undefined' || !Object.keys(cityCoordinates || {}).length) {
            await loadCityCoordinates();
          }
          const lookup = relBuildCoordLookup();
          const origin = lookup.get(normalizeEventLocation(event.citta));
          if (origin) {
            const items = upcoming
              .map(item => {
                const point = lookup.get(normalizeEventLocation(item.citta));
                if (!point) return null;
                return { item, km: haversineKm(origin.lat, origin.lng, point.lat, point.lng) };
              })
              .filter(Boolean)
              .sort((a, b) => (a.km - b.km) || byStart(a.item, b.item))
              .slice(0, REL_MAX_ITEMS);
            if (items.length) {
              const kmById = new Map(items.map(entry => [String(entry.item.idAuto), entry.km]));
              sections.push(relSectionHtml(
                'vicinanze',
                'Nelle vicinanze',
                `Ordinati per distanza da <strong>${escapeHtml(event.citta)}</strong> · distanza indicativa tra i centri delle località`,
                items.map(entry => entry.item),
                item => {
                  const km = kmById.get(String(item.idAuto));
                  return km < 1 ? 'Stessa località' : `${Math.round(km)} km`;
                }
              ));
            }
          }
        } catch (error) {
          console.error('Errore eventi nelle vicinanze:', error);
        }
      }
      /* ---------- 3) STESSO PERIODO (± 2 settimane) ---------- */
      if (currentRange) {
        const windowStart = currentRange.start.getTime() - REL_PERIOD_DAYS * REL_DAY_MS;
        const windowEnd = currentRange.end.getTime() + REL_PERIOD_DAYS * REL_DAY_MS;
        const items = pool
          .filter(item => {
            const range = relRange(item);
            return range.start.getTime() <= windowEnd && range.end.getTime() >= windowStart;
          })
          .sort(byStart)
          .slice(0, REL_MAX_ITEMS);
        if (items.length) {
          sections.push(relSectionHtml(
            'periodo',
            'Nello stesso periodo',
            `Eventi tra il ${escapeHtml(relFormatDay(new Date(windowStart), false))} e il ${escapeHtml(relFormatDay(new Date(windowEnd), false))} (circa due settimane prima e dopo)`,
            items
          ));
        }
      }
      host.innerHTML = sections.join('');
      host.querySelectorAll('.rel-section').forEach(relInitCarousel);
    }
    /* =========================================================
       AVVIO
       ========================================================= */
    document.addEventListener(
      'DOMContentLoaded',
      loadEvent
    );
  </script>
</body>
