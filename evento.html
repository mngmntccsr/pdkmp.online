  <script>

    /* =========================================================
       API
       ========================================================= */

    const API_URL =
      'https://paddockmap-api.managementcesar37.workers.dev/?v=' +
      Date.now();


    /* =========================================================
       ID EVENTO
       ========================================================= */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const eventId =
      urlParams.get('id');


    const container =
      document.getElementById(
        'eventContainer'
      );


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }


      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* =========================================================
       DATE
       ========================================================= */

    function formatDate(dateString) {

      if (!dateString) {

        return '';

      }


      const date =
        new Date(dateString);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return escapeHtml(
          dateString
        );

      }


      return date.toLocaleDateString(
        'it-IT',
        {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }
      );

    }


    function formatEventDate(event) {

      const start =
        event.dataInizio;


      const end =
        event.dataFine;


      if (!start) {

        return '';

      }


      if (
        !end ||
        start === end
      ) {

        return formatDate(start);

      }


      return (
        `${formatDate(start)} – ${formatDate(end)}`
      );

    }


    /* =========================================================
       DISCIPLINE
       ========================================================= */

    function normalizeDisciplines(event) {

      if (
        Array.isArray(
          event.disciplina
        )
      ) {

        return event.disciplina;

      }


      if (
        typeof event.disciplina === 'string'
      ) {

        return event.disciplina

          .split(',')

          .map(
            item => item.trim()
          )

          .filter(Boolean);

      }


      return [];

    }


    function getDisciplineIcon(
      discipline
    ) {

      const value =
        String(
          discipline || ''
        ).toLowerCase();


      if (
        typeof window.getDisciplineIcon ===
        'function'
      ) {

        try {

          return window.getDisciplineIcon(
            discipline
          );

        } catch (error) {}

      }


      if (
        typeof window.getIconForDiscipline ===
        'function'
      ) {

        try {

          return window.getIconForDiscipline(
            discipline
          );

        } catch (error) {}

      }


      if (
        value.includes('rally')
      ) {

        return '🏁';

      }


      if (
        value.includes('slalom') ||
        value.includes('cronoscalata') ||
        value.includes('salita')
      ) {

        return '🏎️';

      }


      if (
        value.includes('gt') ||
        value.includes('turismo')
      ) {

        return '🏎️';

      }


      if (
        value.includes('kart')
      ) {

        return '🏎️';

      }


      if (
        value.includes('moto') ||
        value.includes('motocicl')
      ) {

        return '🏍️';

      }


      return '🏁';

    }


    /* =========================================================
       IMMAGINE EVENTO
       =========================================================

       IMPORTANTE:

       Qui NON vengono utilizzate:

       - immagini organizzatore
       - random1.png
       - random2.png
       - random3.png
       - random4.png

       Se l'evento ha una vera immagine:
       → locandina

       Se non ce l'ha:
       → Google Ads
       ========================================================= */

    function getEventPoster(event) {

      if (
        event.immagine &&
        String(event.immagine).trim() !== ''
      ) {

        return String(
          event.immagine
        ).trim();

      }


      return '';

    }


    /* =========================================================
       INGRESSO GRATUITO
       ========================================================= */

    function getFreeEntry(event) {

      if (
        event.eventoGratuito === true ||
        event.eventoGratuito === 'true'
      ) {

        return 'Ingresso gratuito';

      }


      return '';

    }


    /* =========================================================
       URL BIGLIETTI
       ========================================================= */

    function getTicketUrl(event) {

      return (

        event.linkBiglietti ||

        event.biglietti ||

        event.ticketUrl ||

        event.urlBiglietti ||

        ''

      );

    }


    /* =========================================================
       URL INFORMAZIONI
       ========================================================= */

    function getInfoUrl(event) {

      return (
        event.linkInfo || ''
      );

    }


    /* =========================================================
       ID CIRCUITO
       =========================================================

       paddock-actions.js richiede data-circuit-id.
       La pagina evento si adatta ai dati disponibili senza
       modificare il file comune.

       Se l'API fornisce un identificativo esplicito, viene usato
       quello; in assenza di un campo ID dedicato, viene usato
       event.circuito come valore canonico già presente nell'evento.
       ========================================================= */

    function getCircuitId(event) {

      return (
        event.circuitId ||
        event.circuit_id ||
        event.idCircuito ||
        event.circuitoId ||
        event.circuito ||
        ''
      );

    }


    /* =========================================================
       RENDER EVENTO
       ========================================================= */

    function renderEvent(event) {

      const disciplines =
        normalizeDisciplines(event);


      /* -------------------------------------------------------
         DISCIPLINE HTML
         ------------------------------------------------------- */

      const disciplineHtml =
        disciplines.length

          ? disciplines

              .map(
                discipline => `

                  <span class="event-discipline">

                    <span>
                      ${getDisciplineIcon(
                        discipline
                      )}
                    </span>

                    ${escapeHtml(
                      discipline

    /* =========================================================
       MAPPA EVENTO
       ========================================================= */

    async function initializeEventMap(event) {

      const mapContainer =
        document.getElementById(
          'eventMap'
        );


      if (!mapContainer) {

        return;

      }


      /* -------------------------------------------------------
         NESSUNA CITTÀ
         ------------------------------------------------------- */

      if (!event.citta) {

        mapContainer.outerHTML = `

          <div
            class="event-map-missing"
          >

            Posizione non disponibile
            per questo evento.

          </div>

        `;

        return;

      }


      try {

        /* -----------------------------------------------------
           CARICAMENTO COORDINATE
           ----------------------------------------------------- */

        await loadCityCoordinates();


        /* -----------------------------------------------------
           RICERCA ESATTA
           ----------------------------------------------------- */

        let coordinates =
          cityCoordinates[
            event.citta
          ];


        /* -----------------------------------------------------
           FALLBACK NORMALIZZATO
           ----------------------------------------------------- */

        if (!coordinates) {

          const normalizeCity =
            value =>

              String(
                value || ''
              )

                .normalize('NFD')

                .replace(
                  /[\u0300-\u036f]/g,
                  ''
                )

                .toLowerCase()

                .trim();


          const target =
            normalizeCity(
              event.citta
            );


          const matchingKey =
            Object.keys(
              cityCoordinates
            )

              .find(
                key =>
                  normalizeCity(
                    key
                  ) === target
              );


          if (matchingKey) {

            coordinates =
              cityCoordinates[
                matchingKey
              ];

          }

        }


        /* -----------------------------------------------------
           NESSUNA COORDINATA
           ----------------------------------------------------- */

        if (

          !coordinates ||

          !Array.isArray(
            coordinates
          ) ||

          coordinates.length < 2

        ) {

          mapContainer.outerHTML = `

            <div
              class="event-map-missing"
            >

              Non sono disponibili
              coordinate per

              <strong>
                &nbsp;
                ${escapeHtml(
                  event.citta
                )}
              </strong>.

            </div>

          `;

          return;

        }


        /* -----------------------------------------------------
           COORDINATE
           ----------------------------------------------------- */

        const lat =
          Number(
            coordinates[0]
          );


        const lng =
          Number(
            coordinates[1]
          );


        if (

          !Number.isFinite(lat) ||

          !Number.isFinite(lng)

        ) {

          mapContainer.outerHTML = `

            <div
              class="event-map-missing"
            >

              Coordinate non valide
              per

              <strong>
                &nbsp;
                ${escapeHtml(
                  event.citta
                )}
              </strong>.

            </div>

          `;

          return;

        }


        /* -----------------------------------------------------
           CREA MAPPA
           ----------------------------------------------------- */

        const map =
          createBaseMap(
            'eventMap'
          );


        /* -----------------------------------------------------
           POSIZIONA MAPPA
           ----------------------------------------------------- */

        map.setView(
          [
            lat,
            lng
          ],
          11
        );


        /* -----------------------------------------------------
           MARKER
           ----------------------------------------------------- */

        const marker =
          L.circleMarker(

            [
              lat,
              lng
            ],

            {

              radius:
                10,

              color:
                '#FFFFFF',

              weight:
                3,

              fillColor:
                '#FF4B24',

              fillOpacity:
                1

            }

          ).addTo(map);


        /* -----------------------------------------------------
           POPUP
           ----------------------------------------------------- */

        marker.bindPopup(`

          <strong>

            ${escapeHtml(
              event.titolo ||
              'Evento'
            )}

          </strong>

          <br>

          ${escapeHtml(
            event.citta
          )}

        `);


        marker.openPopup();


        /* -----------------------------------------------------
           INVALIDATE SIZE
           ----------------------------------------------------- */

        setTimeout(

          () =>
            map.invalidateSize(),

          100

        );


      } catch (error) {

        console.error(
          'Errore caricamento mappa evento:',
          error
        );


        mapContainer.outerHTML = `

          <div
            class="event-map-missing"
          >

            Impossibile caricare
            la posizione dell'evento.

          </div>

        `;

      }

    }


    /* =========================================================
       CARICAMENTO DATI
       ========================================================= */

    async function loadEvent() {


      /* -------------------------------------------------------
         ID MANCANTE
         ------------------------------------------------------- */

      if (!eventId) {

        container.innerHTML = `

          <div
            class="event-state error"
          >

            <h1>
              Evento non specificato
            </h1>

            <p>
              L'URL non contiene
              l'identificativo
              dell'evento.
            </p>

          </div>

        `;

        return;

      }


      try {


        /* -----------------------------------------------------
           FETCH API
           ----------------------------------------------------- */

        const response =
          await fetch(

            API_URL,

            {
              cache:
                'no-store'
            }

          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        /* -----------------------------------------------------
           TESTO RISPOSTA
           ----------------------------------------------------- */

        const text =
          await response.text();


        /* -----------------------------------------------------
           JSON
           ----------------------------------------------------- */

        const data = pmCleanEvents(JSON.parse(text));


        if (!Array.isArray(data)) {

          throw new Error(
            'Formato dati non valido'
          );

        }


        /* -----------------------------------------------------
           ID CANONICO
           -----------------------------------------------------

           L'evento viene cercato esclusivamente
           attraverso idAuto.
           ----------------------------------------------------- */

        const event =
          data.find(

            item =>

              String(
                item.idAuto
              ) ===

              String(
                eventId
              )

          );


        /* -----------------------------------------------------
           EVENTO NON TROVATO
           ----------------------------------------------------- */

        if (!event) {

          container.innerHTML = `

            <div
              class="event-state error"
            >

              <h1>
                Evento non trovato
              </h1>

              <p>
                L'evento richiesto
                non è presente
                nei dati disponibili.
              </p>

            </div>

          `;

          return;

        }


        /* -----------------------------------------------------
           EVENTO TROVATO
           ----------------------------------------------------- */

        renderEvent(event);


      } catch (error) {

        console.error(
          'Errore caricamento evento:',
          error
        );


        container.innerHTML = `

          <div
            class="event-state error"
          >

            <h1>
              Errore
            </h1>

            <p>
              Non è stato possibile
              caricare i dati
              dell'evento.
            </p>

          </div>

        `;

      }

    }


    /* =========================================================
       AVVIO
       ========================================================= */
    document.addEventListener(
      'DOMContentLoaded',
      loadEvent
    );
  </script>
