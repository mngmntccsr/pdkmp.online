<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Evento | PaddockMap</title>

  <!-- PaddockMap -->
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3VQxK8fR1LxFJwK7fW5FhV1Q5rJwM="
    crossorigin=""
  >

  <style>
    /* =========================================================
       EVENT DETAIL PAGE
       Usa il Design System già presente in style.css
       ========================================================= */

    .event-page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 3rem;
    }

    .event-back {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1.25rem;

      color: var(--ink-soft);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .event-back:hover {
      color: var(--accent);
      transform: translateX(-3px);
    }

    .event-detail {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .event-detail-image-wrapper {
      width: 100%;
      aspect-ratio: 16 / 7;
      background: var(--bg);
      overflow: hidden;
    }

    .event-detail-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .event-detail-content {
      padding: 2rem;
    }

    .event-detail-date {
      display: flex;
      align-items: center;
      gap: 0.5rem;

      margin-bottom: 0.75rem;

      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .event-detail-title {
      margin: 0 0 1rem;

      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.02;
      letter-spacing: -0.035em;
    }

    .event-detail-disciplines {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 1.75rem;
    }

    .event-detail-disciplines .event-discipline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;

      min-height: 36px;
      padding: 0.45rem 0.75rem;

      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent);

      font-size: 0.82rem;
      font-weight: 800;
    }

    .event-detail-info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .event-detail-info-box {
      padding: 1rem 1.1rem;

      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    .event-detail-info-label {
      display: block;
      margin-bottom: 0.35rem;

      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .event-detail-info-value {
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 750;
      line-height: 1.35;
    }

    .event-detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      padding-top: 0.25rem;
    }

    .event-detail-actions .btn {
      width: auto;
      min-width: 150px;
    }

    .event-detail-map-section {
      margin-top: 1.5rem;
    }

    .event-detail-map-title {
      margin: 0 0 0.8rem;

      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.35rem;
    }

    #eventMap {
      width: 100%;
      height: 420px;

      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;

      box-shadow: var(--shadow-card);
    }

    .event-map-missing {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 220px;
      padding: 2rem;

      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);

      background: var(--bg);
      color: var(--ink-soft);
      text-align: center;
    }

    .event-state {
      padding: 4rem 1.5rem;
      text-align: center;
    }

    .event-state h1 {
      margin: 0 0 0.75rem;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 2rem;
    }

    .event-state p {
      margin: 0;
      color: var(--ink-soft);
    }

    .event-state.error h1 {
      color: var(--accent);
    }

    @media (max-width: 700px) {
      .event-page-container {
        padding: 1.25rem 1rem 2rem;
      }

      .event-detail-image-wrapper {
        aspect-ratio: 16 / 9;
      }

      .event-detail-content {
        padding: 1.25rem;
      }

      .event-detail-title {
        font-size: 2rem;
      }

      .event-detail-info {
        grid-template-columns: 1fr;
      }

      .event-detail-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .event-detail-actions .btn {
        width: 100%;
        min-width: 0;
      }

      #eventMap {
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <header class="header" id="mainHeader">
    <div class="header-content">

      <div class="logo">
        Paddock<span>Map</span>
      </div>

      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="mappa.html">Mappa</a>
        <a href="contatti.html">Promuovi Evento</a>
      </nav>

    </div>
  </header>


  <!-- =========================================================
       CONTENUTO
       ========================================================= -->
  <main class="event-page-container">

    <a href="index.html" class="event-back">
      ← Torna agli eventi
    </a>

    <div id="eventContainer">

      <!-- Stato iniziale -->
      <div class="event-detail">
        <div class="event-state">
          <h1>Caricamento evento...</h1>
          <p>Attendi qualche secondo.</p>
        </div>
      </div>

    </div>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->
  <footer class="footer">
    <div class="footer-content">
      <div>
        <strong>PaddockMap</strong>
        <span>Il calendario del motorsport italiano.</span>
      </div>
    </div>
  </footer>


  <!-- =========================================================
       LEAFLET
       ========================================================= -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>


  <!-- =========================================================
       PADDOKMAP JS
       ========================================================= -->
  <script src="icons.js"></script>
  <script src="map-common.js"></script>

  <!-- Supabase / account -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="paddock-actions.js"></script>


  <!-- =========================================================
       EVENT PAGE LOGIC
       ========================================================= -->
  <script>

    const API_URL =
      'https://paddockmap-api.managementcesar37.workers.dev/?v=' +
      Date.now();


    /*
     * Recupera l'ID dell'evento dalla URL.
     *
     * Esempio:
     * evento.html?id=12345
     */
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');


    const container = document.getElementById('eventContainer');


    /*
     * Escape HTML.
     * Evita che eventuali caratteri speciali presenti nei dati
     * rompano il markup della pagina.
     */
    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return '';
      }

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    /*
     * Formattazione della data.
     */
    function formatDate(dateString) {

      if (!dateString) {
        return '';
      }

      const date = new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return escapeHtml(dateString);
      }

      return date.toLocaleDateString('it-IT', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }


    /*
     * Data completa dell'evento.
     */
    function formatEventDate(event) {

      const start = event.dataInizio;
      const end = event.dataFine;

      if (!start) {
        return '';
      }

      if (!end || start === end) {
        return formatDate(start);
      }

      return `${formatDate(start)} – ${formatDate(end)}`;
    }


    /*
     * Recupera il nome della disciplina.
     */
    function normalizeDisciplines(event) {

      if (Array.isArray(event.disciplina)) {
        return event.disciplina;
      }

      if (typeof event.disciplina === 'string') {
        return event.disciplina
          .split(',')
          .map(item => item.trim())
          .filter(Boolean);
      }

      return [];
    }


    /*
     * Icone discipline.
     *
     * Se icons.js espone una funzione di mapping già presente
     * nel progetto, viene utilizzata.
     */
    function getDisciplineIcon(discipline) {

      const value = String(discipline || '').toLowerCase();

      if (typeof window.getDisciplineIcon === 'function') {
        try {
          return window.getDisciplineIcon(discipline);
        } catch (error) {
          // fallback
        }
      }

      if (typeof window.getIconForDiscipline === 'function') {
        try {
          return window.getIconForDiscipline(discipline);
        } catch (error) {
          // fallback
        }
      }

      if (
        value.includes('rally') ||
        value.includes('rallye')
      ) {
        return '🏁';
      }

      if (
        value.includes('slalom') ||
        value.includes('cronoscalata') ||
        value.includes('hill')
      ) {
        return '🏎️';
      }

      if (
        value.includes('gt') ||
        value.includes('turismo')
      ) {
        return '🏎️';
      }

      if (
        value.includes('kart')
      ) {
        return '🏎️';
      }

      if (
        value.includes('moto') ||
        value.includes('motocicl')
      ) {
        return '🏍️';
      }

      return '🏁';
    }


    /*
     * Immagine evento.
     *
     * Prima usa quella presente nei dati.
     * Se manca, usa una immagine di fallback.
     */
    function getEventImage(event) {

      if (event.immagine) {
        return event.immagine;
      }

      return 'images/default-event.jpg';
    }


    /*
     * Stato ingresso gratuito.
     */
    function getFreeEntry(event) {

      if (
        event.ingressoGratuito === true ||
        event.ingressoGratuito === 'true' ||
        event.ingresso === 'gratuito' ||
        event.ingresso === 'Gratuito'
      ) {
        return 'Ingresso gratuito';
      }

      return '';
    }


    /*
     * Render pagina evento.
     */
    function renderEvent(event) {

      const disciplines = normalizeDisciplines(event);

      const disciplineHtml = disciplines.length
        ? disciplines.map(discipline => `
            <span class="event-discipline">
              <span>${getDisciplineIcon(discipline)}</span>
              ${escapeHtml(discipline)}
            </span>
          `).join('')
        : '';

      const freeEntry = getFreeEntry(event);

      const circuit = event.circuito || '—';
      const city = event.citta || '—';
      const organizer = event.organizzatore || '—';

      const ticketUrl =
        event.linkBiglietti ||
        event.biglietti ||
        event.ticketUrl ||
        event.urlBiglietti ||
        '';

      const infoUrl =
        event.link ||
        event.url ||
        event.linkInfo ||
        event.urlInfo ||
        '';

      const saveEventId = event.idAuto;

      document.title =
        `${event.titolo || 'Evento'} | PaddockMap`;


      container.innerHTML = `

        <article class="event-detail">

          <!-- Immagine -->
          <div class="event-detail-image-wrapper">

            <img
              class="event-detail-image"
              src="${escapeHtml(getEventImage(event))}"
              alt="${escapeHtml(event.titolo || 'Evento PaddockMap')}"
              loading="eager"
              onerror="this.src='images/default-event.jpg'"
            >

          </div>


          <!-- Contenuto -->
          <div class="event-detail-content">

            ${
              formatEventDate(event)
                ? `
                  <div class="event-detail-date">
                    📅
                    <span>${formatEventDate(event)}</span>
                  </div>
                `
                : ''
            }


            <h1 class="event-detail-title">
              ${escapeHtml(event.titolo || 'Evento')}
            </h1>


            ${
              disciplineHtml
                ? `
                  <div class="event-detail-disciplines">
                    ${disciplineHtml}
                  </div>
                `
                : ''
            }


            <!-- Informazioni -->
            <div class="event-detail-info">

              <div class="event-detail-info-box">
                <span class="event-detail-info-label">
                  Circuito
                </span>

                <span class="event-detail-info-value">
                  ${escapeHtml(circuit)}
                </span>
              </div>


              <div class="event-detail-info-box">
                <span class="event-detail-info-label">
                  Località
                </span>

                <span class="event-detail-info-value">
                  ${escapeHtml(city)}
                </span>
              </div>


              <div class="event-detail-info-box">
                <span class="event-detail-info-label">
                  Organizzatore
                </span>

                <span class="event-detail-info-value">
                  ${escapeHtml(organizer)}
                </span>
              </div>


              ${
                freeEntry
                  ? `
                    <div class="event-detail-info-box">
                      <span class="event-detail-info-label">
                        Ingresso
                      </span>

                      <span class="event-detail-info-value">
                        ${escapeHtml(freeEntry)}
                      </span>
                    </div>
                  `
                  : ''
              }

            </div>


            <!-- Azioni -->
            <div class="event-detail-actions">

              <button
                type="button"
                class="btn btn-secondary"
                data-event-id="${escapeHtml(saveEventId)}"
                data-action="save-event"
              >
                ☆ Salva evento
              </button>


              ${
                event.circuito
                  ? `
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-circuit-id="${escapeHtml(event.circuito)}"
                      data-action="follow-circuit"
                    >
                      + Segui circuito
                    </button>
                  `
                  : ''
              }


              ${
                ticketUrl
                  ? `
                    <a
                      href="${escapeHtml(ticketUrl)}"
                      class="btn btn-primary"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      🎟 Biglietti
                    </a>
                  `
                  : ''
              }


              ${
                infoUrl
                  ? `
                    <a
                      href="${escapeHtml(infoUrl)}"
                      class="btn btn-secondary"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ↗ Maggiori informazioni
                    </a>
                  `
                  : ''
              }

            </div>


            <!-- Mappa -->
            <section class="event-detail-map-section">

              <h2 class="event-detail-map-title">
                Posizione dell'evento
              </h2>

              <div id="eventMap"></div>

            </section>

          </div>

        </article>
      `;


      initializeEventMap(event);
    }


    /*
     * Inizializza la mappa usando esattamente lo stesso sistema
     * utilizzato da mappa.html / index.html.
     */
    async function initializeEventMap(event) {

      const mapContainer = document.getElementById('eventMap');

      if (!mapContainer) {
        return;
      }

      if (!event.citta) {

        mapContainer.outerHTML = `
          <div class="event-map-missing">
            Posizione non disponibile per questo evento.
          </div>
        `;

        return;
      }


      try {

        /*
         * coordinates.json viene caricato tramite
         * map-common.js
         */
        await loadCityCoordinates();


        const coordinates = cityCoordinates[event.citta];


        if (
          !coordinates ||
          !Array.isArray(coordinates) ||
          coordinates.length < 2
        ) {

          mapContainer.outerHTML = `
            <div class="event-map-missing">
              Non sono disponibili coordinate per
              <strong>&nbsp;${escapeHtml(event.citta)}</strong>.
            </div>
          `;

          return;
        }


        const lat = Number(coordinates[0]);
        const lng = Number(coordinates[1]);


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {

          mapContainer.outerHTML = `
            <div class="event-map-missing">
              Coordinate non valide per
              <strong>&nbsp;${escapeHtml(event.citta)}</strong>.
            </div>
          `;

          return;
        }


        /*
         * Usa la stessa funzione della mappa principale.
         */
        const map = createBaseMap('eventMap');


        map.setView(
          [lat, lng],
          11
        );


        /*
         * Marker singolo dell'evento.
         */
        const marker = L.circleMarker(
          [lat, lng],
          {
            radius: 10,
            color: '#FFFFFF',
            weight: 3,
            fillColor: '#FF4B24',
            fillOpacity: 1
          }
        ).addTo(map);


        marker.bindPopup(`
          <strong>
            ${escapeHtml(event.titolo || 'Evento')}
          </strong>
          <br>
          ${escapeHtml(event.citta)}
        `);


        /*
         * Apre automaticamente il popup.
         */
        marker.openPopup();


        /*
         * Necessario quando la mappa viene inizializzata
         * dentro un contenitore dinamico.
         */
        setTimeout(() => {
          map.invalidateSize();
        }, 100);

      } catch (error) {

        console.error(
          'Errore caricamento mappa evento:',
          error
        );

        mapContainer.outerHTML = `
          <div class="event-map-missing">
            Impossibile caricare la posizione dell'evento.
          </div>
        `;
      }
    }


    /*
     * Caricamento evento dall'API Cloudflare.
     */
    async function loadEvent() {

      /*
       * ID mancante.
       */
      if (!eventId) {

        container.innerHTML = `
          <div class="event-detail">
            <div class="event-state error">
              <h1>Evento non specificato</h1>
              <p>
                L'URL non contiene l'identificativo dell'evento.
              </p>
            </div>
          </div>
        `;

        return;
      }


      try {

        const response = await fetch(API_URL, {
          cache: 'no-store'
        });


        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const text = await response.text();

        const data = JSON.parse(text);


        if (!Array.isArray(data)) {
          throw new Error(
            'Formato dati non valido'
          );
        }


        /*
         * IMPORTANTE:
         *
         * idAuto è l'identificativo reale dell'evento
         * proveniente dal database Supabase.
         */
        const event = data.find(
          item =>
            String(item.idAuto) === String(eventId)
        );


        /*
         * Evento non trovato.
         */
        if (!event) {

          container.innerHTML = `
            <div class="event-detail">
              <div class="event-state error">
                <h1>Evento non trovato</h1>
                <p>
                  L'evento richiesto non è presente
                  nei dati disponibili.
                </p>
              </div>
            </div>
          `;

          return;
        }


        /*
         * Evento trovato.
         */
        renderEvent(event);

      } catch (error) {

        console.error(
          'Errore caricamento evento:',
          error
        );


        container.innerHTML = `
          <div class="event-detail">
            <div class="event-state error">
              <h1>Errore</h1>
              <p>
                Non è stato possibile caricare
                i dati dell'evento.
              </p>
            </div>
          </div>
        `;
      }
    }


    /*
     * Avvio.
     */
    document.addEventListener(
      'DOMContentLoaded',
      loadEvent
    );

  </script>

</body>
</html>
