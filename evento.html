<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Evento | PaddockMap</title>

  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    /* =========================================================
       PAGINA DETTAGLIO EVENTO
       ========================================================= */

    .event-page-container {
      max-width: none;
      width: 97vw;
      margin: 0 auto;
      padding: 1.25rem 0.75rem 1.25rem;
    }

    .event-back {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1.25rem;

      color: var(--ink-soft);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 750;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .event-back:hover {
      color: var(--accent);
      transform: translateX(-3px);
    }


    /* =========================================================
       SCHEDA PRINCIPALE
       ========================================================= */

    .event-detail {
      display: grid;
      grid-template-columns: minmax(0, 0.62fr) minmax(320px, 0.38fr);

      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);

      overflow: hidden;
    }

    /* =========================================================
       INFORMAZIONI
       ========================================================= */

    .event-detail-info-column {
      padding: 2rem;

      display: flex;
      flex-direction: column;
      justify-content: center;

      min-width: 0;
    }


    /* =========================================================
       IMMAGINE
       ========================================================= */

    .event-detail-image-wrapper {
      width: 100%;
      aspect-ratio: 16 / 8;

      margin-bottom: 1.5rem;

      border-radius: var(--radius-lg);
      overflow: hidden;

      background: var(--bg);
    }

    .event-detail-image {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================================================
       DATA
       ========================================================= */

    .event-detail-date {
      display: flex;
      align-items: center;
      gap: 0.5rem;

      margin-bottom: 0.7rem;

      color: var(--accent);

      font-size: 0.86rem;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.025em;
    }


    /* =========================================================
       TITOLO
       ========================================================= */

    .event-detail-title {
      margin: 0 0 1rem;

      color: var(--ink);

      font-family: var(--font-display);
      font-size: clamp(2rem, 3.2vw, 3rem);
      line-height: 1.03;

      letter-spacing: -0.035em;
    }


    /* =========================================================
       DISCIPLINE
       ========================================================= */

    .event-detail-disciplines {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;

      margin-bottom: 1.4rem;
    }

    .event-detail-disciplines .event-discipline {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;

      min-height: 34px;

      padding: 0.4rem 0.7rem;

      border-radius: var(--radius-pill);

      background: var(--accent-soft);
      color: var(--accent);

      font-size: 0.8rem;
      font-weight: 800;
    }


    /* =========================================================
       BOX INFORMAZIONI
       ========================================================= */

    .event-detail-info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 0.75rem;

      margin-bottom: 1.4rem;
    }

    .event-detail-info-box {
      padding: 0.9rem 1rem;

      background: var(--bg);

      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    .event-detail-info-label {
      display: block;

      margin-bottom: 0.3rem;

      color: var(--muted);

      font-size: 0.7rem;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .event-detail-info-value {
      display: block;

      color: var(--ink);

      font-size: 0.92rem;
      font-weight: 750;
      line-height: 1.35;

      overflow-wrap: anywhere;
    }


    /* =========================================================
       AZIONI
       ========================================================= */

    .event-detail-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 0.6rem;
    }

    .event-detail-actions .btn {
      width: auto;
      min-width: 135px;
    }

    .event-detail-actions .pm-save-btn.active,
    .event-detail-actions .pm-follow-btn.active {
      border-color: var(--accent);
      background: rgba(255, 75, 36, 0.08);
      color: var(--accent);
    }

    .event-detail-actions .pm-save-btn.active svg.icon,
    .event-detail-actions .pm-follow-btn.active svg.icon {
      fill: var(--accent);
    }

    /* =========================================================
       MAPPA
       ========================================================= */

    .event-detail-map-column {
      min-height: 650px;
      position: relative;

      background: var(--bg);
    }

    #eventMap {
      width: 100%;
      height: 100%;
      min-height: 650px;
    }

    .event-map-missing {
      width: 100%;
      height: 100%;
      min-height: 650px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 2rem;

      background: var(--bg);
      color: var(--ink-soft);

      text-align: center;
    }

    @media (min-width: 851px) {
      html, body { height: 100%; overflow: hidden; }
      body { display: flex; flex-direction: column; }

      .event-page-container {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 1.25rem 2rem 1.25rem;
      }

      #eventContainer {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .event-detail {
        flex: 1;
        min-height: 0;
      }

      .event-detail-map-column { min-height: 0; height: 100%; }
      #eventMap { min-height: 0; height: 100%; }
      .event-detail-info-column { padding: 1.5rem 2rem; justify-content: center; overflow: hidden; }
      .footer { display: none; }
    }

    /* =========================================================
       STATO / ERRORI
       ========================================================= */

    .event-state {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);

      padding: 4rem 2rem;

      text-align: center;
    }

    .event-state h1 {
      margin: 0 0 0.7rem;

      color: var(--ink);

      font-family: var(--font-display);
    }

    .event-state p {
      margin: 0;

      color: var(--ink-soft);
    }

    .event-state.error h1 {
      color: var(--accent);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 850px) {

      .event-detail {
        display: block;
      }

      /*
       * Su telefono:
       * informazioni sopra
       * mappa sotto
       */

      .event-detail-info-column {
        padding: 1.25rem;
      }

      .event-detail-map-column {
        min-height: 360px;
      }

      #eventMap {
        min-height: 360px;
        height: 360px;
      }

      .event-map-missing {
        min-height: 360px;
      }

      .event-detail-image-wrapper {
        aspect-ratio: 16 / 9;
      }

      .event-detail-title {
        font-size: 2rem;
      }
    }


    @media (max-width: 550px) {

      .event-page-container {
        padding: 1.25rem 1rem 2rem;
      }

      .event-detail-info-grid {
        grid-template-columns: 1fr;
      }

      .event-detail-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .event-detail-actions .btn {
        width: 100%;
        min-width: 0;
      }

      .event-detail-map-column,
      #eventMap,
      .event-map-missing {
        min-height: 320px;
        height: 320px;
      }
    }
  </style>
</head>


<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="header" id="mainHeader">

    <div class="header-content">

      <div class="logo">
        Paddock<span>Map</span>
      </div>

      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="mappa.html">Mappa</a>
        <a href="contatti.html">Promuovi Evento</a>
      </nav>

    </div>

  </header>


  <!-- =========================================================
       CONTENUTO
       ========================================================= -->

  <main class="event-page-container">

    <a href="index.html" class="event-back">
      ← Torna agli eventi
    </a>


    <div id="eventContainer">

      <div class="event-state">

        <h1>Caricamento evento...</h1>

        <p>
          Attendi qualche secondo.
        </p>

      </div>

    </div>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer class="footer">

    <div class="footer-content">

      <div>
        <strong>PaddockMap</strong>
        <span>Il calendario del motorsport italiano.</span>
      </div>

    </div>

  </footer>


  <!-- =========================================================
       LEAFLET
       ========================================================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
  </script>


  <!-- =========================================================
       PADDockMAP JS
       ========================================================= -->

  <script src="icons.js"></script>
  <script src="map-common.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="paddock-actions.js"></script>


  <!-- =========================================================
       LOGICA PAGINA EVENTO
       ========================================================= -->

  <script>

    /* =========================================================
       API
       ========================================================= */

    const API_URL =
      'https://paddockmap-api.managementcesar37.workers.dev/?v=' +
      Date.now();


    /* =========================================================
       ID EVENTO
       ========================================================= */

    const urlParams =
      new URLSearchParams(window.location.search);

    const eventId =
      urlParams.get('id');


    const container =
      document.getElementById('eventContainer');


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return '';
      }

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    /* =========================================================
       DATE
       ========================================================= */

    function formatDate(dateString) {

      if (!dateString) {
        return '';
      }

      const date =
        new Date(dateString);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return escapeHtml(dateString);
      }

      return date.toLocaleDateString(
        'it-IT',
        {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }
      );
    }


    function formatEventDate(event) {

      const start =
        event.dataInizio;

      const end =
        event.dataFine;


      if (!start) {
        return '';
      }


      if (
        !end ||
        start === end
      ) {
        return formatDate(start);
      }


      return (
        `${formatDate(start)} – ${formatDate(end)}`
      );
    }


    /* =========================================================
       DISCIPLINE
       ========================================================= */

    function normalizeDisciplines(event) {

      if (
        Array.isArray(
          event.disciplina
        )
      ) {
        return event.disciplina;
      }


      if (
        typeof event.disciplina === 'string'
      ) {
        return event.disciplina
          .split(',')
          .map(
            item => item.trim()
          )
          .filter(Boolean);
      }


      return [];
    }


    function getDisciplineIcon(discipline) {

      const value =
        String(
          discipline || ''
        ).toLowerCase();


      if (
        typeof window.getDisciplineIcon ===
        'function'
      ) {
        try {
          return window.getDisciplineIcon(
            discipline
          );
        } catch (error) {}
      }


      if (
        typeof window.getIconForDiscipline ===
        'function'
      ) {
        try {
          return window.getIconForDiscipline(
            discipline
          );
        } catch (error) {}
      }


      if (
        value.includes('rally')
      ) {
        return '🏁';
      }


      if (
        value.includes('slalom') ||
        value.includes('cronoscalata') ||
        value.includes('salita')
      ) {
        return '🏎️';
      }


      if (
        value.includes('gt') ||
        value.includes('turismo')
      ) {
        return '🏎️';
      }


      if (
        value.includes('kart')
      ) {
        return '🏎️';
      }


      if (
        value.includes('moto') ||
        value.includes('motocicl')
      ) {
        return '🏍️';
      }


      return '🏁';
    }


    /* =========================================================
       IMMAGINI
       =========================================================
       
       Prima usa event.immagine.

       Se non esiste, prova a usare la stessa logica
       delle immagini random della homepage.
       ========================================================= */

    function getRandomEventImage() {

      /*
       * Se index.html / il progetto espone già
       * una funzione per le immagini automatiche,
       * proviamo ad utilizzarla.
       */

      if (
        typeof window.getRandomEventImage ===
        'function'
      ) {
        try {
          const image =
            window.getRandomEventImage();

          if (image) {
            return image;
          }
        } catch (error) {}
      }


      /*
       * Lista fallback.
       *
       * IMPORTANTE:
       * se nella tua cartella immagini i nomi sono
       * differenti, questi possono essere sostituiti
       * con quelli già utilizzati da index.html.
       */

      const fallbackImages = [

        'images/evento-1.jpg',
        'images/evento-2.jpg',
        'images/evento-3.jpg',
        'images/evento-4.jpg',
        'images/evento-5.jpg'

      ];


      return fallbackImages[
        Math.floor(
          Math.random() *
          fallbackImages.length
        )
      ];
    }


    function getEventImage(event) {

      if (
        event.immagine &&
        String(event.immagine).trim() !== ''
      ) {
        return event.immagine;
      }


      return getRandomEventImage();
    }


    /* =========================================================
       INGRESSO GRATUITO
       ========================================================= */

    function getFreeEntry(event) {
      if (event.eventoGratuito === true || event.eventoGratuito === 'true') {
        return 'Ingresso gratuito';
      }
      return '';
    }


    /* =========================================================
       URL
       ========================================================= */

    function getTicketUrl(event) {

      return (
        event.linkBiglietti ||
        event.biglietti ||
        event.ticketUrl ||
        event.urlBiglietti ||
        ''
      );
    }


    function getInfoUrl(event) {
      return event.linkInfo || '';
    }


    /* =========================================================
       RENDER EVENTO
       ========================================================= */

    function renderEvent(event) {

      const disciplines =
        normalizeDisciplines(event);


      const disciplineHtml =
        disciplines.length

          ? disciplines
              .map(
                discipline => `
                  <span class="event-discipline">
                    <span>
                      ${getDisciplineIcon(discipline)}
                    </span>

                    ${escapeHtml(discipline)}
                  </span>
                `
              )
              .join('')

          : '';


      const freeEntry =
        getFreeEntry(event);


      const circuit =
        event.circuito || '—';


      const city =
        event.citta || '—';


      const organizer =
        event.organizzatore || '—';


      const ticketUrl =
        getTicketUrl(event);


      const infoUrl =
        getInfoUrl(event);


      const eventImage =
        getEventImage(event);


      document.title =
        `${event.titolo || 'Evento'} | PaddockMap`;


      container.innerHTML = `
        
        <article class="event-detail">


          <!-- =================================================
               MAPPA
               ================================================= -->

          <div class="event-detail-map-column">

            <div id="eventMap"></div>

          </div>


          <!-- =================================================
               INFORMAZIONI
               ================================================= -->

          <div class="event-detail-info-column">


            <!-- Immagine -->

            <div class="event-detail-image-wrapper">

              <img
                class="event-detail-image"
                src="${escapeHtml(eventImage)}"
                alt="${escapeHtml(
                  event.titolo ||
                  'Evento PaddockMap'
                )}"
                loading="eager"
                onerror="
                  this.onerror=null;
                  this.src='${escapeHtml(
                    getRandomEventImage()
                  )}';
                "
              >

            </div>


            <!-- Data -->

            ${
              formatEventDate(event)

                ? `
                  <div class="event-detail-date">

                    <span>📅</span>

                    <span>
                      ${formatEventDate(event)}
                    </span>

                  </div>
                `

                : ''
            }


            <!-- Titolo -->

            <h1 class="event-detail-title">

              ${escapeHtml(
                event.titolo ||
                'Evento'
              )}

            </h1>


            <!-- Discipline -->

            ${
              disciplineHtml

                ? `
                  <div class="event-detail-disciplines">
                    ${disciplineHtml}
                  </div>
                `

                : ''
            }

            <!-- Informazioni -->
            <div class="event-detail-info-grid">

              <div class="event-detail-info-box">
                <span class="event-detail-info-label">Circuito</span>
                <span class="event-detail-info-value">
                  ${escapeHtml(circuit)}
                </span>
              </div>

              <div class="event-detail-info-box">
                <span class="event-detail-info-label">Località</span>
                <span class="event-detail-info-value">
                  ${escapeHtml(city)}
                </span>
              </div>

              <div class="event-detail-info-box">
                <span class="event-detail-info-label">Organizzatore</span>
                <span class="event-detail-info-value">
                  ${escapeHtml(organizer)}
                </span>
              </div>

              <div class="event-detail-info-box">
                <span class="event-detail-info-label">Ingresso</span>
                <span class="event-detail-info-value">
                  ${
                    ticketUrl
                      ? `
        
                            href="${escapeHtml(ticketUrl)}"
                            class="btn btn-primary"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            ${PMIcons.ticket} Biglietti
                          </a>
                        `
                      : ''
                  }
                </span>
              </div>

            </div>
            
            <!-- Azioni -->
            <div class="event-detail-actions">

              <button
                type="button"
                class="btn btn-secondary pm-save-btn"
                data-event-id="${escapeHtml(window.pmEventId(event))}"
                onclick="pmHandleSaveClick(this)"
              >
                ${PMIcons.heart} Salva evento
              </button>

              ${
                event.circuito
                  ? `
                    <button
                      type="button"
                      class="btn btn-secondary pm-follow-btn"
                      data-circuit-id="${escapeHtml(event.circuito)}"
                      onclick="pmHandleFollowClick(this)"
                    >
                      ${PMIcons.flag} Segui circuito
                    </button>
                  `
                  : ''
              }

              ${
                ticketUrl
                  ? `
        
                      href="${escapeHtml(ticketUrl)}"
                      class="btn btn-primary"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ${PMIcons.ticket} Biglietti
                    </a>
                  `
                  : ''
              }

              ${
                infoUrl
                  ? `
                    <a
                      href="${escapeHtml(infoUrl)}"
                      class="btn btn-secondary"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ${PMIcons.info} Maggiori informazioni
                    </a>
                  `
                  : ''
              }

            </div>
          </div>

        </article>

      `;
      
      if (window.pmRefreshButtonStates) window.pmRefreshButtonStates();
      initializeEventMap(event);
    }


    /* =========================================================
       MAPPA
       ========================================================= */

    async function initializeEventMap(event) {

      const mapContainer =
        document.getElementById('eventMap');


      if (!mapContainer) {
        return;
      }


      if (!event.citta) {

        mapContainer.outerHTML = `

          <div class="event-map-missing">

            Posizione non disponibile
            per questo evento.

          </div>

        `;

        return;
      }


      try {

        /*
         * Carica coordinates.json attraverso
         * map-common.js
         */

        await loadCityCoordinates();


        /*
         * Prima prova il nome esatto.
         */

        let coordinates =
          cityCoordinates[event.citta];


        /*
         * Fallback:
         * confronto normalizzato.
         */

        if (!coordinates) {

          const normalizeCity =
            value => String(value || '')
              .normalize('NFD')
              .replace(
                /[\u0300-\u036f]/g,
                ''
              )
              .toLowerCase()
              .trim();


          const target =
            normalizeCity(event.citta);


          const matchingKey =
            Object.keys(cityCoordinates)
              .find(
                key =>
                  normalizeCity(key) === target
              );


          if (matchingKey) {
            coordinates =
              cityCoordinates[matchingKey];
          }
        }


        /*
         * Nessuna coordinata.
         */

        if (
          !coordinates ||
          !Array.isArray(coordinates) ||
          coordinates.length < 2
        ) {

          mapContainer.outerHTML = `

            <div class="event-map-missing">

              Non sono disponibili
              coordinate per
              <strong>
                &nbsp;${escapeHtml(event.citta)}
              </strong>.

            </div>

          `;

          return;
        }


        const lat =
          Number(coordinates[0]);


        const lng =
          Number(coordinates[1]);


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {

          mapContainer.outerHTML = `

            <div class="event-map-missing">

              Coordinate non valide
              per
              <strong>
                &nbsp;${escapeHtml(event.citta)}
              </strong>.

            </div>

          `;

          return;
        }


        /*
         * Usa la stessa mappa di Mappa/Home.
         */

        const map =
          createBaseMap('eventMap');


        /*
         * Zoom sulla città.
         */

        map.setView(
          [lat, lng],
          11
        );


        /*
         * Marker PaddockMap.
         */

        const marker =
          L.circleMarker(
            [lat, lng],
            {
              radius: 10,

              color: '#FFFFFF',
              weight: 3,

              fillColor: '#FF4B24',
              fillOpacity: 1
            }
          ).addTo(map);


        marker.bindPopup(`

          <strong>
            ${escapeHtml(
              event.titolo ||
              'Evento'
            )}
          </strong>

          <br>

          ${escapeHtml(event.citta)}

        `);


        marker.openPopup();


        /*
         * Leaflet deve ricalcolare le dimensioni
         * dopo il rendering della griglia.
         */

        setTimeout(
          () => map.invalidateSize(),
          100
        );


      } catch (error) {

        console.error(
          'Errore caricamento mappa evento:',
          error
        );


        mapContainer.outerHTML = `

          <div class="event-map-missing">

            Impossibile caricare
            la posizione dell'evento.

          </div>

        `;
      }
    }


    /* =========================================================
       CARICAMENTO DATI
       ========================================================= */

    async function loadEvent() {

      /*
       * ID mancante
       */

      if (!eventId) {

        container.innerHTML = `

          <div class="event-state error">

            <h1>
              Evento non specificato
            </h1>

            <p>
              L'URL non contiene
              l'identificativo dell'evento.
            </p>

          </div>

        `;

        return;
      }


      try {

        const response =
          await fetch(
            API_URL,
            {
              cache: 'no-store'
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const text =
          await response.text();


        const data =
          JSON.parse(text);


        if (!Array.isArray(data)) {

          throw new Error(
            'Formato dati non valido'
          );

        }


        /*
         * =====================================================
         * ID CANONICO
         * =====================================================
         *
         * L'evento viene cercato esclusivamente attraverso
         * idAuto proveniente da Supabase.
         */

        const event =
          data.find(
            item =>
              String(item.idAuto) ===
              String(eventId)
          );


        if (!event) {

          container.innerHTML = `

            <div class="event-state error">

              <h1>
                Evento non trovato
              </h1>

              <p>
                L'evento richiesto non è presente
                nei dati disponibili.
              </p>

            </div>

          `;

          return;
        }


        /*
         * Evento trovato.
         */

        renderEvent(event);


      } catch (error) {

        console.error(
          'Errore caricamento evento:',
          error
        );


        container.innerHTML = `

          <div class="event-state error">

            <h1>
              Errore
            </h1>

            <p>
              Non è stato possibile caricare
              i dati dell'evento.
            </p>

          </div>

        `;
      }
    }


    /* =========================================================
       AVVIO
       ========================================================= */

    document.addEventListener(
      'DOMContentLoaded',
      loadEvent
    );

  </script>

</body>
</html>
