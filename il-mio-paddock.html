<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio Paddock - PaddockMap</title>
<meta name="description" content="Il tuo spazio personale su PaddockMap: eventi salvati, circuiti seguiti, alert.">
<link rel="stylesheet" href="style.css">
<script src="icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="auth.js" defer></script>
<script src="paddock-actions.js" defer></script>
<style>
.pk-container { max-width:900px; margin:0 auto; padding:2rem 1.25rem 3.5rem; }
.pk-welcome h1 { font-size:1.5rem; margin-bottom:0.2rem; }
.pk-welcome p { color:var(--ink-soft); font-size:0.9rem; margin-bottom:1.5rem; }
.pk-stats { display:flex; gap:1rem; margin-bottom:1.75rem; flex-wrap:wrap; }
.pk-stat { background:var(--surface,#fff); border:1px solid var(--line,#e0e0e0); border-radius:var(--radius-md,10px); padding:1rem 1.25rem; flex:1; min-width:140px; display:flex; align-items:center; gap:0.7rem; }
.pk-stat svg.icon { color:var(--accent); width:22px; height:22px; flex-shrink:0; }
.pk-stat .num { font-size:1.4rem; font-weight:800; line-height:1; }
.pk-stat .lbl { font-size:0.78rem; color:var(--ink-soft); }
.pk-section { background:var(--surface,#fff); border:1px solid var(--line,#e0e0e0); border-radius:var(--radius-md,10px); padding:1.25rem 1.5rem; margin-bottom:1.5rem; }
.pk-section h2 { font-size:1.05rem; margin-bottom:0.9rem; display:flex; align-items:center; gap:0.5rem; }
.pk-section h2 svg.icon { color:var(--accent); width:19px; height:19px; }
.pk-row { display:flex; justify-content:space-between; align-items:center; padding:0.6rem 0; border-bottom:1px solid var(--line,#f0f0f0); font-size:0.9rem; }
.pk-row:last-child { border-bottom:none; }
.pk-title { font-weight:600; }
.pk-sub { color:var(--ink-soft); font-size:0.8rem; }
.pk-remove { background:none; border:none; color:var(--ink-soft); cursor:pointer; }
.pk-remove:hover { color:var(--accent); }
.pk-empty { color:var(--ink-soft); font-size:0.85rem; padding:0.5rem 0; }
.pk-alert-form { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.9rem; }
.pk-alert-form select { padding:0.55rem 0.8rem; border-radius:var(--radius-sm,6px); border:1.5px solid var(--line,#e0e0e0); font-size:0.85rem; font-family:inherit; }
.pk-premium-box { background:var(--ink,#212121); color:#fff; border-radius:var(--radius-md,10px); padding:1.5rem; text-align:center; margin-bottom:1.5rem; }
.pk-premium-box h2 { display:flex; gap:0.5rem; align-items:center; justify-content:center; margin-bottom:0.4rem; }
.pk-premium-box h2 svg.icon { color:var(--accent); }
.pk-premium-box p { color:rgba(255,255,255,0.65); font-size:0.88rem; margin-bottom:1rem; }
.pk-premium-box ul { list-style:none; text-align:left; max-width:280px; margin:0 auto 1.1rem; font-size:0.85rem; }
.pk-premium-box li { margin-bottom:0.4rem; display:flex; gap:0.5rem; align-items:center; }
.pk-premium-box li svg.icon { color:var(--accent); width:15px; height:15px; flex-shrink:0; }
.pk-logout-row { text-align:center; margin-top:1.5rem; }
.pk-gate { text-align:center; padding:4rem 1rem; color:var(--ink-soft); }
</style>
</head>
<body>

<header class="header">
<div class="header-content">
<div class="logo">Paddock<span>Map</span></div>
<nav class="nav-menu">
<a href="index.html">Home</a>
<a href="mappa.html">Mappa</a>
<a href="contatti.html">Promuovi Evento</a>
</nav>
</div>
</header>

<div class="pk-container" id="paddockContainer">
  <div class="pk-gate">Caricamento del tuo Paddock...</div>
</div>

<script>
(function () {
  const container = document.getElementById('paddockContainer');
  const fmtDate = d => d ? new Date(d).toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' }) : '';

  async function init() {
    if (!window.pmSupabase) { setTimeout(init, 100); return; }
    const { data: { session } } = await window.pmSupabase.auth.getSession();
    if (!session) {
      container.innerHTML = `<div class="pk-gate"><p>Devi accedere per vedere il tuo Paddock.</p><br><a href="index.html">Torna alla home e accedi</a></div>`;
      return;
    }
    const userId = session.user.id;
    const name = session.user.user_metadata?.full_name || session.user.email.split('@')[0];

    const [{ data: profile }, { data: savedEvents }, { data: circuits }, { data: alerts }] = await Promise.all([
      window.pmSupabase.from('profiles').select('*').eq('id', userId).single(),
      window.pmSupabase.from('saved_events').select('*').eq('user_id', userId),
      window.pmSupabase.from('followed_circuits').select('*').eq('user_id', userId),
      window.pmSupabase.from('alerts').select('*').eq('user_id', userId)
    ]);

    let feedEvents = [];
    try { feedEvents = await (await fetch('https://paddockmap-api.managementcesar37.workers.dev/?v=' + Date.now())).json(); } catch (e) {}
    const feedById = {};
    feedEvents.forEach(ev => feedById[window.pmEventId(ev)] = ev);

    const plan = profile?.plan || 'free';
    const planLabel = plan === 'premium' ? 'Premium' : plan === 'premium_plus' ? 'Premium Plus' : 'Free';

    container.innerHTML = `
      <div class="pk-welcome">
        <h1>Bentornato, ${name}</h1>
        <p>Il tuo Paddock · Piano attuale: <strong>${planLabel}</strong></p>
      </div>

      <div class="pk-stats">
        <div class="pk-stat">${PMIcons.heart}<div><div class="num">${savedEvents?.length || 0}</div><div class="lbl">eventi salvati</div></div></div>
        <div class="pk-stat">${PMIcons.flag}<div><div class="num">${circuits?.length || 0}</div><div class="lbl">circuiti seguiti</div></div></div>
        <div class="pk-stat">${PMIcons.bell}<div><div class="num">${alerts?.length || 0}</div><div class="lbl">alert attivi</div></div></div>
      </div>

      ${plan === 'free' ? `
      <div class="pk-premium-box">
        <h2>${PMIcons.sparkle} PaddockMap Premium</h2>
        <p>Segui automaticamente gli eventi che ti interessano.</p>
        <ul>
          <li>${PMIcons.check} Alert personalizzati illimitati</li>
          <li>${PMIcons.check} Preferiti illimitati</li>
          <li>${PMIcons.check} Calendario personale</li>
          <li>${PMIcons.check} Funzioni avanzate</li>
        </ul>
        <a href="premium.html" class="btn btn-primary">Scopri Premium</a>
      </div>` : ''}

      <div class="pk-section">
        <h2>${PMIcons.heart} Eventi salvati</h2>
        ${(savedEvents && savedEvents.length) ? savedEvents.map(se => {
          const ev = feedById[se.event_id];
          return `<div class="pk-row"><div><div class="pk-title">${ev ? ev.titolo : 'Evento non più disponibile'}</div><div class="pk-sub">${ev ? fmtDate(ev.dataInizio) + (ev.circuito ? ' · ' + ev.circuito : '') : ''}</div></div><button class="pk-remove" onclick="removeSavedEvent('${se.event_id}')">${PMIcons.close}</button></div>`;
        }).join('') : '<div class="pk-empty">Non hai ancora salvato nessun evento.</div>'}
      </div>

      <div class="pk-section">
        <h2>${PMIcons.flag} Circuiti seguiti</h2>
        ${(circuits && circuits.length) ? circuits.map(c => `<div class="pk-row"><div class="pk-title">${c.circuit_id}</div><button class="pk-remove" onclick="removeCircuit('${c.circuit_id}')">${PMIcons.close}</button></div>`).join('') : '<div class="pk-empty">Non segui ancora nessun circuito.</div>'}
      </div>

      <div class="pk-section">
        <h2>${PMIcons.bell} Alert</h2>
        ${(alerts && alerts.length) ? alerts.map(a => `<div class="pk-row"><div><div class="pk-title">${a.circuit_id || 'Tutti i circuiti'}</div><div class="pk-sub">${a.discipline || 'Tutte le discipline'}</div></div><button class="pk-remove" onclick="removeAlert('${a.id}')">${PMIcons.close}</button></div>`).join('') : '<div class="pk-empty">Nessun alert attivo.</div>'}
        <form class="pk-alert-form" id="newAlertForm">
          <select id="alertCircuit"><option value="">Tutti i circuiti</option>${[...new Set(feedEvents.map(e => e.circuito).filter(Boolean))].sort().map(c => `<option value="${c}">${c}</option>`).join('')}</select>
          <select id="alertDiscipline"><option value="">Tutte le discipline</option>${['Gt','Formula','Misto','Storico','Rally','Le Mans Prototype','Cronoscalata','Raduno','Trackday'].map(d => `<option value="${d}">${d}</option>`).join('')}</select>
          <button type="submit" class="btn btn-secondary">Crea alert</button>
        </form>
      </div>

      <div class="pk-logout-row"><button class="btn btn-secondary" id="logoutBtn">${PMIcons.logout} Esci</button></div>
    `;

    document.getElementById('logoutBtn').addEventListener('click', async () => { await window.pmSignOut(); window.location.href = 'index.html'; });
    document.getElementById('newAlertForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await window.pmSupabase.from('alerts').insert({
        user_id: userId,
        circuit_id: document.getElementById('alertCircuit').value || null,
        discipline: document.getElementById('alertDiscipline').value || null
      });
      if (error) { window.pmShowToast(error.message.includes('Limite piano Free') ? 'Limite alert del piano Free raggiunto. <a href="premium.html">Scopri Premium</a>' : 'Errore nella creazione dell\'alert.'); return; }
      init();
    });
  }

  window.removeSavedEvent = async (id) => { const { data: { session } } = await window.pmSupabase.auth.getSession(); await window.pmSupabase.from('saved_events').delete().eq('user_id', session.user.id).eq('event_id', id); init(); };
  window.removeCircuit = async (id) => { const { data: { session } } = await window.pmSupabase.auth.getSession(); await window.pmSupabase.from('followed_circuits').delete().eq('user_id', session.user.id).eq('circuit_id', id); init(); };
  window.removeAlert = async (id) => { await window.pmSupabase.from('alerts').delete().eq('id', id); init(); };

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
