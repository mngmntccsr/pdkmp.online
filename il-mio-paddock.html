<!DOCTYPE html>
<html lang="it">
<head>
<script src="consent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio Paddock - PaddockMap</title>
<meta name="description" content="Il tuo spazio personale su PaddockMap: eventi salvati, circuiti seguiti, alert.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="a11y.css">
<script src="a11y.js" defer></script>  
<script src="icons.js"></script>
<script src="vendor/supabase.js" defer></script>
<script src="auth.js" defer></script>
<script src="paddock-actions.js" defer></script>
  
<style>
.pk-container { width:min(100% - 2rem, 1560px); margin:0 auto; padding:2rem 0 3.5rem; }
.pk-welcome { position:relative; padding:1.5rem 1.7rem; margin-bottom:1rem; overflow:hidden; border-radius:var(--radius-xl,28px); color:#fff; background:linear-gradient(115deg,#171b24 0%,#292e39 68%,#20232b 100%); box-shadow:var(--shadow-card); }
.pk-welcome:after { content:""; position:absolute; right:-35px; top:-80px; width:260px; height:260px; border:1px solid rgba(255,255,255,.09); border-radius:50%; box-shadow:0 0 0 24px rgba(255,255,255,.025),0 0 0 50px rgba(255,255,255,.02); pointer-events:none; }
.pk-welcome h1 { font-family:var(--font-display); font-size:clamp(1.5rem,2.5vw,2.15rem); letter-spacing:-.04em; margin-bottom:.25rem; position:relative; z-index:1; }
.pk-welcome p { color:rgba(255,255,255,.65); font-size:.9rem; margin:0; position:relative; z-index:1; }
.pk-welcome:before { content:"PIT WALL / DRIVER PROFILE"; display:block; color:var(--accent); font-size:.68rem; font-weight:800; letter-spacing:.16em; margin-bottom:.55rem; position:relative; z-index:1; }
.pk-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-bottom:1.25rem; }
.pk-stat { background:var(--surface-glass-strong,var(--surface,#fff)); border:1px solid rgba(255,255,255,.75); border-radius:var(--radius-lg,20px); padding:1.1rem 1.25rem; min-width:0; display:flex; align-items:center; gap:.8rem; box-shadow:var(--shadow-card); }
.pk-stat svg.icon { color:var(--accent); width:24px; height:24px; flex-shrink:0; }
.pk-stat .num { font-family:var(--font-display); font-size:1.65rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.pk-stat .lbl { font-size:.76rem; color:var(--ink-soft); margin-top:.25rem; }
.pk-dashboard { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(310px,1fr); gap:1.1rem; align-items:start; }
.pk-main,.pk-side { min-width:0; }
.pk-section { background:var(--surface-glass-strong,var(--surface,#fff)); border:1px solid rgba(255,255,255,.75); border-radius:var(--radius-lg,20px); padding:1.25rem 1.4rem; margin-bottom:1.1rem; box-shadow:var(--shadow-card); }
.pk-section h2 { font-family:var(--font-display); font-size:1.02rem; margin-bottom:.85rem; display:flex; align-items:center; gap:.5rem; }
.pk-section h2 svg.icon { color:var(--accent); width:19px; height:19px; }
.pk-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.72rem 0; border-bottom:1px solid var(--line,#f0f0f0); font-size:.9rem; }
.pk-row:last-child { border-bottom:none; }
.pk-title { font-weight:650; line-height:1.35; }
a.pk-link { color:inherit; text-decoration:none; display:block; flex:1; min-width:0; }
a.pk-link:hover .pk-title { color:var(--accent); }
.pk-sub { color:var(--ink-soft); font-size:.8rem; }
.pk-remove { background:none; border:1px solid transparent; border-radius:8px; color:var(--muted); cursor:pointer; padding:.35rem; flex-shrink:0; }
.pk-remove:hover { color:var(--accent); background:var(--accent-soft); }
.pk-empty { color:var(--ink-soft); font-size:.85rem; padding:.65rem 0; }
.pk-alert-form { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:.9rem; }
.pk-alert-form select { padding:.6rem .7rem; border-radius:var(--radius-sm,10px); border:1.5px solid var(--line-strong); background:var(--surface); font-size:.83rem; font-family:inherit; min-width:0; flex:1; }
.pk-alert-form .btn { width:auto; white-space:nowrap; padding:.65rem 1rem; }
.pk-logout-row { text-align:center; margin-top:1.25rem; }
.pk-gate { text-align:center; padding:4rem 1rem; color:var(--ink-soft); }
.pk-telemetry { background:#171b24; color:#fff; border-radius:var(--radius-lg,20px); padding:1.25rem; margin-bottom:1.1rem; box-shadow:var(--shadow-card); position:relative; overflow:hidden; }
.pk-telemetry-head { display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:1rem; }
.pk-telemetry-title { font-size:.76rem; letter-spacing:.12em; font-weight:800; color:rgba(255,255,255,.72); }
.pk-live { display:inline-flex; align-items:center; gap:.4rem; font-size:.67rem; text-transform:uppercase; letter-spacing:.08em; color:#9ce4b8; }
.pk-live:before { content:""; width:7px; height:7px; border-radius:50%; background:#39cf76; box-shadow:0 0 0 4px rgba(57,207,118,.12); }
.pk-telemetry-main { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.pk-telemetry-metric { padding:.8rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.045); border-radius:12px; }
.pk-telemetry-metric strong { display:block; font-family:var(--font-display); font-size:1.55rem; line-height:1.1; font-variant-numeric:tabular-nums; }
.pk-telemetry-metric span { display:block; color:rgba(255,255,255,.55); font-size:.7rem; margin-top:.35rem; }
.pk-telemetry-label { color:rgba(255,255,255,.55); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; margin:1rem 0 .55rem; }
.pk-signal { display:flex; align-items:center; gap:.65rem; font-size:.8rem; color:rgba(255,255,255,.8); padding:.55rem 0; border-top:1px solid rgba(255,255,255,.09); }
.pk-signal-mark { width:24px; height:24px; border-radius:8px; display:grid; place-items:center; background:rgba(255,75,36,.16); color:#ff7658; font-weight:800; flex-shrink:0; }
.pk-meter { height:5px; background:rgba(255,255,255,.12); border-radius:99px; overflow:hidden; margin-top:.5rem; }
.pk-meter span { display:block; height:100%; background:var(--accent); border-radius:99px; }
.pk-telemetry-foot { font-size:.68rem; color:rgba(255,255,255,.42); margin-top:1rem; padding-top:.7rem; border-top:1px solid rgba(255,255,255,.09); }
.pk-privacy { margin-top:.2rem; }
@media (min-width:1200px) { .pk-side { position:sticky; top:90px; } }
@media (max-width:900px) { .pk-dashboard { grid-template-columns:minmax(0,1fr) minmax(260px,.8fr); gap:.8rem; } .pk-section { padding:1.1rem; } }
@media (max-width:700px) { .pk-container { width:calc(100% - 1rem); padding-top:1rem; } .pk-welcome { padding:1.25rem; border-radius:var(--radius-lg); } .pk-stats { gap:.55rem; } .pk-stat { padding:.8rem .65rem; gap:.45rem; border-radius:14px; } .pk-stat svg.icon { width:19px; height:19px; } .pk-stat .num { font-size:1.35rem; } .pk-stat .lbl { font-size:.67rem; } .pk-dashboard { grid-template-columns:1fr; } .pk-side { display:contents; } .pk-telemetry { order:0; } .pk-main { order:1; } .pk-section { padding:1rem; margin-bottom:.8rem; } .pk-row { gap:.5rem; } .pk-alert-form { flex-direction:column; } .pk-alert-form .btn { width:100%; } }
@media (max-width:380px) { .pk-stats { grid-template-columns:1fr; } .pk-stat { padding:.8rem 1rem; } }
</style>
</head>
<body>

<header class="header">
<div class="header-content">
<div class="logo">Paddock<span>Map</span></div>
<nav class="nav-menu">
<a href="index.html">Home</a>
<a href="mappa.html">Mappa</a>
<a href="contatti.html">Promuovi Evento</a>
</nav>
</div>
</header>

<div class="pk-container" id="paddockContainer">
  <div class="pk-gate">Caricamento del tuo Paddock...</div>
</div>

<script>
(function () {
  const container = document.getElementById('paddockContainer');
  const FEED_URL = 'https://paddockmap-api.managementcesar37.workers.dev/?v=';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = d => d ? new Date(d).toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' }) : '';
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

  async function init() {
    if (!window.pmSupabase || !window.pmEventId) { setTimeout(init, 100); return; }
    const sb = window.pmSupabase;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      container.innerHTML = `<div class="pk-gate"><p>Devi accedere per vedere il tuo Paddock.</p><br><a href="index.html">Torna alla home e accedi</a></div>`;
      return;
    }
    const userId = session.user.id;
    const name = session.user.user_metadata?.full_name || session.user.email.split('@')[0];

    const [{ data: savedRaw }, { data: circuits }, { data: alerts }] = await Promise.all([
      sb.from('saved_events').select('*').eq('user_id', userId),
      sb.from('followed_circuits').select('*').eq('user_id', userId),
      sb.from('alerts').select('*').eq('user_id', userId)
    ]);

    // Feed eventi: stesso criterio di index.html (solo eventi non ancora terminati)
    let feedOk = false, activeEvents = [];
    try {
      const all = await (await fetch(FEED_URL + Date.now())).json();
      const today = todayISO();
      activeEvents = all.filter(ev => (ev.dataFine || ev.dataInizio) >= today);
      feedOk = Array.isArray(all) && all.length > 0;
    } catch (e) {}

    const activeById = {};
    activeEvents.forEach(ev => activeById[window.pmEventId(ev)] = ev);

    // Pulizia: elimino dal DB gli eventi salvati terminati/rimossi (solo se il feed è stato letto correttamente)
    let savedEvents = savedRaw || [];
    if (feedOk) {
      const staleIds = savedEvents.filter(se => !activeById[se.event_id]).map(se => se.event_id);
      if (staleIds.length) {
        await sb.from('saved_events').delete().eq('user_id', userId).in('event_id', staleIds);
        savedEvents = savedEvents.filter(se => activeById[se.event_id]);
      }
    }
    // Ordino per data
    savedEvents = savedEvents
      .map(se => ({ se, ev: activeById[se.event_id] }))
      .filter(x => x.ev)
      .sort((a, b) => new Date(a.ev.dataInizio) - new Date(b.ev.dataInizio));

    const countByCircuit = {};
    activeEvents.forEach(ev => { if (ev.circuito) countByCircuit[ev.circuito] = (countByCircuit[ev.circuito] || 0) + 1; });

    const circuitOptions = [...new Set(activeEvents.map(e => e.circuito).filter(Boolean))].sort();

    container.innerHTML = `
      <div class="pk-welcome">
        <h1>Bentornato, ${esc(name)}</h1>
        <p>Il tuo Paddock</p>
      </div>

      <div class="pk-stats">
        <div class="pk-stat">${PMIcons.heart}<div><div class="num">${savedEvents.length}</div><div class="lbl">eventi salvati</div></div></div>
        <div class="pk-stat">${PMIcons.flag}<div><div class="num">${(circuits || []).length}</div><div class="lbl">circuiti seguiti</div></div></div>
        <div class="pk-stat">${PMIcons.bell}<div><div class="num">${(alerts || []).length}</div><div class="lbl">alert attivi</div></div></div>
      </div>

      <div class="pk-section">
        <h2>${PMIcons.heart} Eventi salvati</h2>
        ${savedEvents.length ? savedEvents.map(({ se, ev }) => `
          <div class="pk-row">
            <a class="pk-link" href="index.html?search=${encodeURIComponent(ev.titolo)}">
              <div class="pk-title">${esc(ev.titolo)}</div>
              <div class="pk-sub">${fmtDate(ev.dataInizio)}${ev.dataFine && ev.dataFine !== ev.dataInizio ? ' - ' + fmtDate(ev.dataFine) : ''}${ev.circuito ? ' · ' + esc(ev.circuito) : ''}</div>
            </a>
            <button class="pk-remove" data-remove="event" data-id="${esc(se.event_id)}" aria-label="Rimuovi">${PMIcons.close}</button>
          </div>`).join('') : '<div class="pk-empty">Non hai eventi salvati in programma. Clicca il cuore su un evento per aggiungerlo.</div>'}
      </div>

      <div class="pk-section">
        <h2>${PMIcons.flag} Circuiti seguiti</h2>
        ${(circuits && circuits.length) ? circuits.map(c => {
          const n = countByCircuit[c.circuit_id] || 0;
          return `
          <div class="pk-row">
            <a class="pk-link" href="index.html?circuit=${encodeURIComponent(c.circuit_id)}">
              <div class="pk-title">${esc(c.circuit_id)}</div>
              <div class="pk-sub">${n === 0 ? 'Nessun evento in programma' : n === 1 ? '1 evento in programma' : n + ' eventi in programma'}</div>
            </a>
            <button class="pk-remove" data-remove="circuit" data-id="${esc(c.circuit_id)}" aria-label="Rimuovi">${PMIcons.close}</button>
          </div>`;
        }).join('') : '<div class="pk-empty">Non segui ancora nessun circuito.</div>'}
      </div>

      <div class="pk-section">
        <h2>${PMIcons.bell} Alert</h2>
        ${(alerts && alerts.length) ? alerts.map(a => `
          <div class="pk-row">
            <div><div class="pk-title">${esc(a.circuit_id || 'Tutti i circuiti')}</div><div class="pk-sub">${esc(a.discipline || 'Tutte le discipline')}</div></div>
            <button class="pk-remove" data-remove="alert" data-id="${esc(a.id)}" aria-label="Rimuovi">${PMIcons.close}</button>
          </div>`).join('') : '<div class="pk-empty">Nessun alert attivo.</div>'}
        <form class="pk-alert-form" id="newAlertForm">
          <select id="alertCircuit" aria-label="Circuito"><option value="">Tutti i circuiti</option>${circuitOptions.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
          <select id="alertDiscipline" aria-label="Disciplina"><option value="">Tutte le discipline</option>${['Gt','Formula','Misto','Storico','Rally','Le Mans Prototype','Cronoscalata','Raduno','Trackday'].map(d => `<option value="${d}">${d}</option>`).join('')}</select>
          <button type="submit" class="btn btn-secondary">Crea alert</button>
        </form>
      </div>

      <div class="pk-section">
        <h2>${PMIcons.user} Privacy e dati</h2>
        <p class="pk-sub" style="margin-bottom:.8rem">Scarica i tuoi dati o elimina definitivamente l'account. <a href="legale.html#privacy">Informativa privacy</a></p>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap">
          <button class="btn btn-secondary" id="exportBtn" style="width:auto">Scarica i miei dati</button>
          <button class="btn btn-secondary" id="deleteBtn" style="width:auto">Elimina il mio account</button>
        </div>
      </div>
      
      <div class="pk-logout-row"><button class="btn btn-secondary" id="logoutBtn">${PMIcons.logout} Esci</button></div>
    `;

    // Organizzazione dashboard: contenuti esistenti, senza cambiare le azioni Supabase.
    const sections = [...container.querySelectorAll('.pk-section')];
    const sectionByTitle = title => sections.find(el => el.querySelector('h2')?.textContent.includes(title));
    const eventsSection = sectionByTitle('Eventi salvati');
    const circuitsSection = sectionByTitle('Circuiti seguiti');
    const alertsSection = sectionByTitle('Alert');
    const privacySection = sectionByTitle('Privacy e dati');
    const dashboard = document.createElement('div');
    dashboard.className = 'pk-dashboard';
    const mainColumn = document.createElement('main');
    mainColumn.className = 'pk-main';
    const sideColumn = document.createElement('aside');
    sideColumn.className = 'pk-side';
    const telemetry = document.createElement('section');
    telemetry.className = 'pk-telemetry';
    const upcomingCount = activeEvents.length;
    const telemetryPct = Math.min(100, Math.round((savedEvents.length / Math.max(1, activeEvents.length)) * 100));
    telemetry.innerHTML = `
      <div class="pk-telemetry-head"><div class="pk-telemetry-title">RACE CONTROL</div><div class="pk-live">Sistema operativo</div></div>
      <div class="pk-telemetry-main">
        <div class="pk-telemetry-metric"><strong>${upcomingCount}</strong><span>Eventi in calendario</span></div>
        <div class="pk-telemetry-metric"><strong>${savedEvents.length}</strong><span>Preferiti in garage</span></div>
      </div>
      <div class="pk-telemetry-label">Attività del paddock</div>
      <div class="pk-signal"><span class="pk-signal-mark">♥</span><div style="flex:1">Eventi monitorati<div class="pk-meter"><span style="width:${telemetryPct}%"></span></div></div><strong>${telemetryPct}%</strong></div>
      <div class="pk-signal"><span class="pk-signal-mark">⚑</span><div style="flex:1">Circuiti seguiti</div><strong>${(circuits || []).length}</strong></div>
      <div class="pk-signal"><span class="pk-signal-mark">⌁</span><div style="flex:1">Alert configurati</div><strong>${(alerts || []).length}</strong></div>
      <div class="pk-telemetry-foot">DATI PERSONALI · AGGIORNATI ALL'APERTURA DELLA PAGINA</div>`;
    container.insertBefore(dashboard, privacySection);
    dashboard.append(mainColumn, sideColumn);
    if (eventsSection) mainColumn.appendChild(eventsSection);
    sideColumn.append(telemetry);
    if (circuitsSection) sideColumn.appendChild(circuitsSection);
    if (alertsSection) sideColumn.appendChild(alertsSection);
    if (privacySection) privacySection.classList.add('pk-privacy');

    document.getElementById('logoutBtn').addEventListener('click', async () => { await window.pmSignOut(); window.location.href = 'index.html'; });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const dump = { email: session.user.email, nome: name, eventi_salvati: savedRaw || [], circuiti_seguiti: circuits || [], alert: alerts || [] };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }));
      a.download = 'paddockmap-i-miei-dati.json'; a.click();
    });
    
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('Eliminare definitivamente il tuo account e tutti i dati collegati? L\'operazione non si può annullare.')) return;
      const { error } = await sb.rpc('delete_my_account');
      if (error) { window.pmShowToast('Impossibile eliminare l\'account. Usa il link «Cancella i miei dati».'); return; }
      await sb.auth.signOut(); window.location.href = 'index.html';
    });

    document.getElementById('newAlertForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.from('alerts').insert({
        user_id: userId,
        circuit_id: document.getElementById('alertCircuit').value || null,
        discipline: document.getElementById('alertDiscipline').value || null
      });
      if (error) { window.pmShowToast('Errore nella creazione dell\'alert.'); return; }
      init();
    });

    container.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id, kind = btn.dataset.remove;
        if (kind === 'event') await sb.from('saved_events').delete().eq('user_id', userId).eq('event_id', id);
        if (kind === 'circuit') await sb.from('followed_circuits').delete().eq('user_id', userId).eq('circuit_id', id);
        if (kind === 'alert') await sb.from('alerts').delete().eq('id', id);
        init();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
