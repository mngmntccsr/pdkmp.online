<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaddockMap - Calendario Eventi Motorsport Italia</title>
    <meta name="description" content="Scopri tutti gli eventi motorsport in Italia: F1, GT, Rally, Kart, Trackday. Calendario completo con date, circuiti e biglietti.">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --racing-red: #E10600;
            --carbon-black: #1a1a1a;
            --track-gray: #2d2d2d;
            --checkered: #f5f5f5;
            --speed-yellow: #FFD700;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--carbon-black);
            background: var(--checkered);
        }

        /* Header con transizione */
        .header {
            background: linear-gradient(135deg, var(--carbon-black) 0%, var(--track-gray) 100%);
            color: var(--white);
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .header.scrolled {
            padding: 0.5rem 1rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            transition: all 0.3s ease;
        }

        .header.scrolled .logo {
            font-size: 1.5rem;
            margin-bottom: 0;
        }

        .logo span {
            color: var(--racing-red);
        }

        .tagline {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            transition: all 0.3s ease;
            opacity: 1;
            max-height: 100px;
            overflow: hidden;
        }

        .header.scrolled .tagline {
            opacity: 0;
            max-height: 0;
            margin: 0;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            transition: all 0.3s ease;
            opacity: 1;
            max-height: 200px;
            overflow: hidden;
        }

        .header.scrolled .stats-bar {
            opacity: 0;
            max-height: 0;
            margin: 0;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 900;
            color: var(--speed-yellow);
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Filters */
        .filters {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .filters h3 {
            color: var(--racing-red);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--carbon-black);
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--racing-red);
        }

        .reset-filters {
            margin-top: 1rem;
            padding: 0.7rem 1.5rem;
            background: var(--track-gray);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .reset-filters:hover {
            background: var(--carbon-black);
        }

        /* Events Grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 4px solid var(--racing-red);
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .event-header {
            background: linear-gradient(135deg, var(--carbon-black) 0%, var(--track-gray) 100%);
            color: white;
            padding: 1.5rem;
        }

        .event-date {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .event-discipline {
            display: inline-block;
            background: var(--racing-red);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .event-body {
            padding: 1.5rem;
        }

        .event-info {
            margin-bottom: 1rem;
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.7rem;
            font-size: 0.95rem;
        }

        .info-icon {
            margin-right: 0.5rem;
            font-size: 1.1rem;
        }

        .event-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--racing-red);
            color: white;
        }

        .btn-primary:hover {
            background: #c00500;
        }

        .btn-secondary {
            background: var(--track-gray);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--carbon-black);
        }

        .no-events {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .no-events h3 {
            color: var(--carbon-black);
            margin-bottom: 1rem;
        }

        .no-events p {
            color: #666;
        }

        /* Footer */
        footer {
            background: var(--carbon-black);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            margin-top: 3rem;
        }

        footer p {
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .header.scrolled .logo {
                font-size: 1.2rem;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
    </style>
</head>
<body>

            <button class="reset-filters" onclick="resetFilters()">Cancella Filtri</button>

        // Funzioni Helper
        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('it-IT', options);
        }

        function formatDateShort(dateString) {
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.toLocaleDateString('it-IT', { month: 'short' });
            return `${day} ${month}`;
        }

        function getDisciplineIcon(disciplina) {
            const icons = {
                'F1': '🏎️',
                'MotoGP': '🏍️',
                'Rally': '🚗',
                'Misto': '🏁',
                'Storico': '🏛️',
                'GT': '🏎️',
                'Kart': '🛺'
            };
            return icons[disciplina] || '🏁';
        }

        // Popola filtri circuiti
        function populateCircuitFilter() {
            const circuits = [...new Set(eventsData.map(e => e.circuito))].sort();
            const select = document.getElementById('filterCircuit');
            
            circuits.forEach(circuit => {
                const option = document.createElement('option');
                option.value = circuit;
                option.textContent = circuit;
                select.appendChild(option);
            });
        }

        // Render eventi
        function renderEvents(events = eventsData) {
            const container = document.getElementById('eventsContainer');
            
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="no-events">
                        <h3>🔍 Nessun evento trovato</h3>
                        <p>Prova a modificare i filtri di ricerca</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="event-card">
                    <div class="event-header">
                        <div class="event-date">
                            📅 ${formatDateShort(event.dataInizio)}${event.dataFine && event.dataFine !== event.dataInizio ? ' - ' + formatDateShort(event.dataFine) : ''}
                        </div>
                        <div class="event-title">${event.titolo}</div>
                        <span class="event-discipline">${getDisciplineIcon(event.disciplina)} ${event.disciplina}</span>
                    </div>
                    <div class="event-body">
                        <div class="event-info">
                            <div class="info-row">
                                <span class="info-icon">🏁</span>
                                <strong>${event.circuito}</strong>
                            </div>
                            <div class="info-row">
                                <span class="info-icon">📍</span>
                                ${event.citta}
                            </div>
                            ${event.organizzatore ? `
                            <div class="info-row">
                                <span class="info-icon">🏢</span>
                                ${event.organizzatore}
                            </div>
                            ` : ''}
                        </div>
                        <div class="event-actions">
                            ${event.linkBiglietti ? `
                                <a href="${event.linkBiglietti}" target="_blank" class="btn btn-primary">
                                    🎫 Biglietti
                                </a>
                            ` : ''}
                            ${event.linkInfo ? `
                                <a href="${event.linkInfo}" target="_blank" class="btn btn-secondary">
                                    ℹ️ Info
                                </a>
                            ` : ''}
                            ${!event.linkBiglietti && !event.linkInfo ? `
                                <button class="btn btn-secondary" disabled style="opacity: 0.5;">
                                    Info in arrivo
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            // Update counter
            document.getElementById('totalEvents').textContent = events.length;
        }

        // Filtri
        function applyFilters() {
            const disciplineFilter = document.getElementById('filterDiscipline').value.toLowerCase();
            const circuitFilter = document.getElementById('filterCircuit').value.toLowerCase();
            const monthFilter = document.getElementById('filterMonth').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            const filtered = eventsData.filter(event => {
                const matchDiscipline = !disciplineFilter || event.disciplina.toLowerCase() === disciplineFilter;
                const matchCircuit = !circuitFilter || event.circuito.toLowerCase() === circuitFilter;
                const matchMonth = !monthFilter || event.dataInizio.substring(5, 7) === monthFilter;
                const matchSearch = !searchFilter || 
                    event.titolo.toLowerCase().includes(searchFilter) ||
                    event.circuito.toLowerCase().includes(searchFilter) ||
                    event.citta.toLowerCase().includes(searchFilter) ||
                    event.disciplina.toLowerCase().includes(searchFilter);

                return matchDiscipline && matchCircuit && matchMonth && matchSearch;
            });

            renderEvents(filtered);
        }

        function resetFilters() {
            document.getElementById('filterDiscipline').value = '';
            document.getElementById('filterCircuit').value = '';
            document.getElementById('filterMonth').value = '';
            document.getElementById('filterSearch').value = '';
            renderEvents(eventsData);
        }

        // Event listeners
        document.getElementById('filterDiscipline').addEventListener('change', applyFilters);
        document.getElementById('filterCircuit').addEventListener('change', applyFilters);
        document.getElementById('filterMonth').addEventListener('change', applyFilters);
        document.getElementById('filterSearch').addEventListener('input', applyFilters);

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', function() {
            populateCircuitFilter();
            renderEvents();
            
            // Update last update date
            const today = new Date();
            document.getElementById('lastUpdate').textContent = today.toLocaleDateString('it-IT', { 
                month: 'long', 
                year: 'numeric' 
            });
        });
    </script>
